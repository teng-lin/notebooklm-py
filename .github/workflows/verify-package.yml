name: Verify Package

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Package source'
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
      account_rotation_base:
        description: 'CI account slot'
        required: true
        default: auto
        type: choice
        options: [auto, A, B, C]

permissions:
  contents: read

jobs:
  resolve-target:
    if: github.repository == 'teng-lin/notebooklm-py'
    runs-on: ubuntu-latest
    outputs:
      is_standard: ${{ steps.trust.outputs.is_standard }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
    - name: Accept only main
      id: trust
      env:
        GITHUB_REF_VALUE: ${{ github.ref }}
      run: |
        if [ "$GITHUB_REF_VALUE" = refs/heads/main ]; then
          echo "is_standard=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_standard=false" >> "$GITHUB_OUTPUT"
          echo "::error::Verify Package accepts only refs/heads/main"
          exit 1
        fi
    - uses: actions/checkout@v7
      if: steps.trust.outputs.is_standard == 'true'
      with:
        ref: refs/heads/main
        fetch-depth: 1
        persist-credentials: false
    - name: Resolve immutable commit
      id: target
      if: steps.trust.outputs.is_standard == 'true'
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  plan-account:
    needs: resolve-target
    if: >-
      github.repository == 'teng-lin/notebooklm-py' &&
      needs.resolve-target.outputs.is_standard == 'true'
    runs-on: ubuntu-latest
    outputs:
      account_slot: ${{ steps.select.outputs.account_slot }}
      master_token_secret_name: ${{ steps.select.outputs.master_token_secret_name }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-target.outputs.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Select package-verification account
      id: select
      env:
        ENABLED_SLOTS: ${{ vars.NOTEBOOKLM_CI_ACCOUNT_SLOTS }}
        MANUAL_BASE: ${{ inputs.account_rotation_base }}
      run: >-
        python scripts/select_ci_account.py
        --enabled-slots "$ENABLED_SLOTS"
        --lane verify-package
        --rotation-day "$(date -u +%F)"
        --manual-base "$MANUAL_BASE"
        --github-output "$GITHUB_OUTPUT"
    - name: Summarize safe package account selection
      env:
        ENABLED_SLOTS: ${{ vars.NOTEBOOKLM_CI_ACCOUNT_SLOTS }}
        SELECTION_MODE: ${{ (inputs.account_rotation_base == '' || inputs.account_rotation_base == 'auto') && 'automatic' || 'manual base' }}
      shell: bash
      run: |
        IFS=, read -ra enabled_slots <<< "$ENABLED_SLOTS"
        enabled_count=${#enabled_slots[@]}
        {
          echo "### Package verification account plan"
          echo "Lane/backend/slot: verify-package / web / ${{ steps.select.outputs.account_slot }}"
          echo "Selection: $SELECTION_MODE; rotation day: ${{ steps.select.outputs.rotation_day }}; enabled slot count: $enabled_count"
        } >> "$GITHUB_STEP_SUMMARY"

  fork-skip:
    if: github.repository != 'teng-lin/notebooklm-py'
    runs-on: ubuntu-latest
    steps:
    - run: echo "::warning::Published-package E2E is unavailable to fork workflows"

  verify:
    name: Verify ${{ inputs.source }} (${{ needs.plan-account.outputs.account_slot }})
    needs: [resolve-target, plan-account]
    if: >-
      github.repository == 'teng-lin/notebooklm-py' &&
      needs.resolve-target.outputs.is_standard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: protected-readonly
    concurrency:
      group: notebooklm-account-${{ needs.plan-account.outputs.account_slot }}
      queue: max
      cancel-in-progress: false
    env:
      NOTEBOOKLM_PROFILE: ci-${{ needs.plan-account.outputs.account_slot }}-verify-package
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-target.outputs.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Configure runner-local paths
      run: |
        {
          echo "NOTEBOOKLM_HOME=$RUNNER_TEMP/notebooklm-home"
          echo "CI_E2E_MANIFEST=$RUNNER_TEMP/notebooklm-e2e/manifest.json"
        } >> "$GITHUB_ENV"
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # @ v7.0.0
    - name: Get version from pyproject.toml
      id: version
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Download exact published wheel for base-install smoke
      env:
        PACKAGE_SOURCE: ${{ inputs.source }}
      run: |
        mkdir -p published-dist
        if [ "$PACKAGE_SOURCE" = testpypi ]; then
          python -m pip download --disable-pip-version-check --no-deps --no-cache-dir \
            --only-binary=:all: --index-url https://test.pypi.org/simple/ \
            --dest published-dist "notebooklm-py==${{ steps.version.outputs.version }}"
        else
          python -m pip download --disable-pip-version-check --no-deps --no-cache-dir \
            --only-binary=:all: --dest published-dist \
            "notebooklm-py==${{ steps.version.outputs.version }}"
        fi
    - name: Verify published base wheel without browser extra
      run: |
        wheels=(published-dist/notebooklm_py-*.whl)
        test "${#wheels[@]}" -eq 1
        python scripts/check_base_wheel.py --wheel "${wheels[0]}"
    - name: Sync locked deps + non-cookies extras
      run: >-
        uv sync --frozen --extra browser --extra dev --extra markdown
        --extra mcp --extra server --extra headless --extra android
    - name: Install published wheel from TestPyPI (--no-deps)
      if: inputs.source == 'testpypi'
      run: >-
        uv pip install --python .venv/bin/python --no-deps --reinstall --no-cache
        --only-binary=:all: --index-url https://test.pypi.org/simple/
        "notebooklm-py==${{ steps.version.outputs.version }}"
    - name: Install published wheel from PyPI (--no-deps)
      if: inputs.source == 'pypi'
      run: >-
        uv pip install --python .venv/bin/python --no-deps --reinstall --no-cache
        --only-binary=:all: "notebooklm-py==${{ steps.version.outputs.version }}"
    - name: Verify version, CLI, and imports
      run: |
        source .venv/bin/activate
        test "$(python -c 'from notebooklm import __version__; print(__version__)')" = "${{ steps.version.outputs.version }}"
        notebooklm --version
        python -c "from notebooklm import NotebookLMClient, Notebook, Source, Artifact"
    - name: Install Playwright browsers
      run: |
        source .venv/bin/activate
        playwright install chromium
        playwright install-deps chromium
    - name: Run routine unit tests
      run: |
        source .venv/bin/activate
        pytest tests/unit -v -m "not refactor_qualification"
    - name: Run refactor qualification
      run: |
        source .venv/bin/activate
        pytest -v -m refactor_qualification
    - name: Run integration tests
      run: |
        source .venv/bin/activate
        pytest tests/integration -v

    # From this point, scripts run with the installed wheel interpreter.
    - name: Materialize selected account
      id: auth
      if: >-
        needs.resolve-target.outputs.is_standard == 'true' &&
        github.repository == 'teng-lin/notebooklm-py'
      continue-on-error: true
      env:
        NOTEBOOKLM_MASTER_TOKEN_JSON: ${{ secrets[needs.plan-account.outputs.master_token_secret_name] }}
      run: |
        source .venv/bin/activate
        python scripts/materialize_ci_auth.py \
          --account-slot "${{ needs.plan-account.outputs.account_slot }}" \
          --profile "$NOTEBOOKLM_PROFILE"
    - name: Sweep stale package-verification copies
      id: sweep
      if: steps.auth.outcome == 'success'
      continue-on-error: true
      env:
        NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID }}
      run: |
        source .venv/bin/activate
        result=$(python scripts/manage_ci_e2e_notebooks.py sweep --backend web \
          --template-id-env NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID \
          --manifest "$CI_E2E_MANIFEST")
        printf '%s\n' "$result"
        printf '### Package copy lifecycle\n%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
    - name: Provision package-verification copies
      id: provision
      if: steps.auth.outcome == 'success' && steps.sweep.outcome == 'success'
      continue-on-error: true
      env:
        NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID }}
        SUMMARY_SLOT: ${{ needs.plan-account.outputs.account_slot }}
      run: |
        source .venv/bin/activate
        python scripts/manage_ci_e2e_notebooks.py provision --backend web \
          --template-id-env NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID \
          --contract tests/fixtures/e2e_template_contract.json \
          --prepared-contract tests/fixtures/e2e_prepared_role_contract.json \
          --mode full --lane verify-package \
          --account-slot "${{ needs.plan-account.outputs.account_slot }}" \
          --manifest "$CI_E2E_MANIFEST" --github-env "$GITHUB_ENV"
        python - <<'PY'
        import json
        import os
        import re
        from collections import Counter
        from pathlib import Path

        manifest = json.loads(Path(os.environ["CI_E2E_MANIFEST"]).read_text(encoding="utf-8"))
        expected = {
            "backend": "web",
            "lane": "verify-package",
            "account_slot": os.environ["SUMMARY_SLOT"],
            "mode": "full",
        }
        if any(manifest.get(key) != value for key, value in expected.items()):
            raise RuntimeError("manifest summary metadata mismatch")
        copies = manifest.get("copies")
        if not isinstance(copies, list) or len(copies) != 2:
            raise RuntimeError("manifest summary role count mismatch")
        rows = {row.get("role"): row for row in copies if isinstance(row, dict)}
        roles = ("reference", "generation")
        if set(rows) != set(roles):
            raise RuntimeError("manifest summary roles mismatch")
        if any(row.get("status") not in {"confirmed", "reconciled"} for row in rows.values()):
            raise RuntimeError("manifest summary contains an unexpected copy outcome")
        if any(row.get("prepared") is not True for row in rows.values()):
            raise RuntimeError("manifest summary contains an unprepared role")
        fingerprint = manifest.get("template_fingerprint")
        if not isinstance(fingerprint, str) or re.fullmatch(r"[0-9a-f]{64}", fingerprint) is None:
            raise RuntimeError("manifest summary fingerprint is malformed")
        outcomes = Counter(str(row["status"]) for row in rows.values())
        lines = [
            "### Prepared package roles",
            f"- Lane/backend/slot: verify-package / web / {expected['account_slot']}",
            f"- Template contract: version=1 fingerprint={fingerprint}",
            f"- Copy outcomes: total=2 confirmed={outcomes['confirmed']} reconciled={outcomes['reconciled']}",
            "- Reference checks: seeded_notes=1 history=passed",
            "- Clean workspace residuals: generation/multi-source=0",
        ]
        with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
            stream.write("\n".join(lines) + "\n")
        PY
    - name: Validate published wheel Android backend
      id: preflight
      if: >-
        github.repository == 'teng-lin/notebooklm-py' &&
        steps.provision.outcome == 'success'
      continue-on-error: true
      run: |
        source .venv/bin/activate
        python - <<'PY'
        import asyncio
        import os
        import gpsoauth  # noqa: F401
        import grpc  # noqa: F401
        from notebooklm import NotebookLMClient
        from notebooklm._android.proto.google.internal.labs.tailwind.orchestration.v1 import read_pb2
        async def main() -> None:
            expected = "google.internal.labs.tailwind.orchestration.v1.GetProjectRequest"
            if read_pb2.GetProjectRequest.DESCRIPTOR.full_name != expected:
                raise RuntimeError("Published wheel has an invalid generated GetProject proto")
            notebook_id = os.environ["NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID"]
            async with NotebookLMClient.from_storage(backend="android") as client:
                if set(client.backends.values()) != {"android"}:
                    raise RuntimeError("Published wheel has a mixed Android backend graph")
                notebook = await client.notebooks.get(notebook_id)
                if notebook.id != notebook_id:
                    raise RuntimeError("Android preflight returned the wrong managed copy")
        asyncio.run(main())
        PY
    - name: Disable generation journal settlement
      id: journal_policy
      if: steps.preflight.outcome == 'success'
      continue-on-error: true
      run: echo "NOTEBOOKLM_E2E_GENERATION_JOURNAL_MODE=off" >> "$GITHUB_ENV"
    - name: Run primary E2E tests
      id: primary
      if: steps.journal_policy.outcome == 'success'
      continue-on-error: true
      run: |
        source .venv/bin/activate
        pytest tests/e2e -m "not variants" --reruns 1 --reruns-delay 30 -v
    - name: Validate lastfailed cache
      id: lastfailed
      if: steps.primary.outcome == 'failure'
      continue-on-error: true
      run: |
        python - <<'PY'
        import json
        from pathlib import Path

        value = json.loads(Path(".pytest_cache/v/cache/lastfailed").read_text(encoding="utf-8"))
        if not isinstance(value, dict) or not value:
            raise RuntimeError("lastfailed cache is empty or malformed")
        if any(not isinstance(node_id, str) or failed is not True for node_id, failed in value.items()):
            raise RuntimeError("lastfailed cache entries are malformed")
        PY
    - name: Retry failed E2E tests after 10-min cool-down
      id: retry
      if: steps.primary.outcome == 'failure' && steps.lastfailed.outcome == 'success'
      continue-on-error: true
      run: |
        sleep 600
        source .venv/bin/activate
        pytest tests/e2e --last-failed --last-failed-no-failures=none -s -v --tb=short
    - name: Collect non-gating artifact telemetry
      id: telemetry
      if: >-
        always() &&
        (steps.primary.outcome == 'success' ||
         (steps.primary.outcome == 'failure' &&
          (steps.lastfailed.outcome == 'failure' ||
           (steps.lastfailed.outcome == 'success' &&
            (steps.retry.outcome == 'success' || steps.retry.outcome == 'failure')))))
      continue-on-error: true
      run: |
        source .venv/bin/activate
        result=$(python scripts/verify_ci_artifacts.py --mode inventory-compat --backend web \
          --notebook-id-env NOTEBOOKLM_GENERATION_NOTEBOOK_ID 2>&1) || {
          echo "::warning::Non-gating package artifact telemetry was unavailable"
          exit 0
        }
        printf '%s\n' "$result"
        printf '### Package artifact telemetry\n%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
    - name: Cleanup package-verification copies
      id: cleanup
      if: always()
      continue-on-error: true
      env:
        NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID }}
      run: |
        source .venv/bin/activate
        result=$(python scripts/manage_ci_e2e_notebooks.py cleanup --backend web \
          --template-id-env NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID \
          --manifest "$CI_E2E_MANIFEST")
        printf '%s\n' "$result"
        printf '### Package copy cleanup\n%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
    - name: Purge package-verification credentials and manifest
      id: purge
      if: always()
      continue-on-error: true
      run: |
        python - <<'PY'
        import os
        import shutil
        from pathlib import Path
        home = Path(os.environ["NOTEBOOKLM_HOME"])
        if home.exists():
            shutil.rmtree(home)
        Path(os.environ["CI_E2E_MANIFEST"]).unlink(missing_ok=True)
        PY
    - name: Aggregate package-verification outcomes
      id: aggregate
      if: always()
      run: >-
        python scripts/aggregate_ci_e2e_outcomes.py
        --lane verify-package --mode full --producer required
        --phase auth=${{ steps.auth.outcome == 'success' && 'success' || 'failure' }}
        --phase sweep=${{ steps.auth.outcome == 'success' && (steps.sweep.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase provision=${{ steps.sweep.outcome == 'success' && (steps.provision.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase preflight=${{ steps.provision.outcome == 'success' && (steps.preflight.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase journal_policy=${{ steps.preflight.outcome == 'success' && (steps.journal_policy.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase primary=${{ steps.journal_policy.outcome == 'success' && (steps.primary.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase lastfailed=${{ steps.primary.outcome == 'failure' && (steps.lastfailed.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase retry=${{ steps.primary.outcome == 'failure' && steps.lastfailed.outcome == 'success' && (steps.retry.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase telemetry=${{ (steps.primary.outcome == 'success' || (steps.primary.outcome == 'failure' && (steps.lastfailed.outcome == 'failure' || (steps.lastfailed.outcome == 'success' && (steps.retry.outcome == 'success' || steps.retry.outcome == 'failure'))))) && (steps.telemetry.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase cleanup=${{ steps.cleanup.outcome == 'success' && 'success' || 'failure' }}
        --phase purge=${{ steps.purge.outcome == 'success' && 'success' || 'failure' }}
