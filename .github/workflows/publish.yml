name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish after a workflow-only recovery."
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve immutable release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      sha: ${{ steps.target.outputs.sha }}
      allowances_json: ${{ steps.allowances.outputs.json }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Validate release target
      id: target
      env:
        REQUESTED_TAG: ${{ inputs.release_tag }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
          test "$GITHUB_REF" = refs/heads/main
          release_tag="$REQUESTED_TAG"
        else
          test "$GITHUB_REF_TYPE" = tag
          release_tag="$GITHUB_REF_NAME"
        fi
        if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
          echo "Invalid release tag" >&2
          exit 1
        fi
        sha=$(git rev-parse "refs/tags/$release_tag^{commit}")
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
          git merge-base --is-ancestor "$sha" origin/main
        else
          test "$sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
        fi
        echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - name: Select reviewed release coverage allowances
      id: allowances
      env:
        RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        path = Path("tests/fixtures/policies/auth_release_coverage_allowances.json")
        policies = json.loads(path.read_text()) if path.exists() else {}
        policy = policies.get(os.environ["RELEASE_TAG"], {"version": 1, "allowances": []})
        with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
            output.write("json=" + json.dumps(policy, separators=(",", ":")) + "\n")
        PY

  auth-patch-audit:
    name: Auth patch audit
    needs: resolve-release
    permissions:
      contents: read
    uses: ./.github/workflows/auth-patch-audit.yml
    with:
      custom_branch: ${{ needs.resolve-release.outputs.sha }}
      release_audit: true
      release_allowances_json: ${{ needs.resolve-release.outputs.allowances_json }}

  build-and-test:
    name: Build candidate artifacts
    needs: [resolve-release, auth-patch-audit]
    runs-on: ubuntu-latest
    # Smoke install pulls `[browser,dev,markdown]` extras (pytest, playwright,
    # mypy, ruff, markdownify, transitive deps). A compromised dep here is a
    # supply-chain concern but cannot mint a Trusted Publishing OIDC token,
    # because this job is not granted `id-token: write`. The publish job
    # below carries that scope and runs nothing except the trusted PyPA
    # action. See issue #820 for the threat model.
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-release.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Resolve candidate commit
      id: candidate
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install package for API inspection
      run: python -m pip install --disable-pip-version-check --editable .

    - name: Validate tag matches version
      run: |
        TAG_VERSION=${RELEASE_TAG#v}
        TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
          echo "Error: Tag version ($TAG_VERSION) doesn't match pyproject.toml ($TOML_VERSION)"
          exit 1
        fi
        echo "Version validated: $TOML_VERSION"

    - name: Resolve previous stable API baseline
      id: baseline
      run: |
        set -euo pipefail
        current_tag="$RELEASE_TAG"
        current_sha=$(git rev-list -n 1 "$current_tag")
        previous_tag=""
        while IFS= read -r tag; do
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
            [ "$(git rev-list -n 1 "$tag")" != "$current_sha" ]; then
            previous_tag="$tag"
            break
          fi
        done < <(git tag --sort=-version:refname --merged "$current_sha")
        if [ -z "$previous_tag" ]; then
          echo "No previous stable release tag found before $current_tag." >&2
          echo "Fetch complete tag history or create a prior stable tag, then rerun the release." >&2
          exit 1
        fi
        echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
        echo "Using previous stable API baseline: $previous_tag"

    - name: Audit public API compatibility before artifact publication
      run: |
        python scripts/audit_public_api_compat.py \
          --baseline-ref "${{ steps.baseline.outputs.previous_tag }}" \
          --check-stale

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build==1.5.0

    - name: Build package
      run: |
        python -m build

    - name: Upload distribution artifacts
      # Capture pristine wheel + sdist BEFORE any third-party code (smoke
      # install, playwright, pytest) runs against `dist/`. If we uploaded
      # after the smoke install, a compromised dev/test dep could mutate
      # `dist/` post-build, and the publish job would upload tampered bytes
      # — attested with the project's trusted OIDC identity. Uploading here
      # snapshots the build output before any attacker-controlled code has
      # touched the runner. Smoke install/test below still runs against
      # `dist/` for behavior validation but can no longer influence what
      # the publish job receives.
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # @ v7
      with:
        name: notebooklm-py-dist
        path: dist/
        if-no-files-found: error
        # One-day retention is intentional: publish consumes this artifact
        # immediately. See issue #829 for the recovery trade-off.
        retention-days: 1

    - name: Verify built base wheel without browser extra
      shell: bash
      run: |
        wheels=(dist/notebooklm_py-*.whl)
        test "${#wheels[@]}" -eq 1
        python scripts/check_base_wheel.py --wheel "${wheels[0]}"

  offline-qualification:
    name: Qualify candidate wheel
    needs: build-and-test
    uses: ./.github/workflows/offline-qualification.yml
    with:
      candidate_sha: ${{ needs.build-and-test.outputs.candidate_sha }}
      artifact_name: notebooklm-py-dist
      tier: release

  publish:
    name: Publish to PyPI
    needs: [build-and-test, offline-qualification]
    runs-on: ubuntu-latest
    environment: release
    # Minimum-scope publish job: only the trusted PyPA action runs here. No
    # `actions/checkout`, no Python install, no third-party dependencies in
    # the runner environment — so the OIDC token request that `id-token:
    # write` enables has no co-tenant code that could exfiltrate it.
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # @ v8.0.1
      with:
        name: notebooklm-py-dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # @ v1.14.2
      with:
        # PEP 740 attestations: pypa/gh-action-pypi-publish generates an
        # in-toto attestation for the uploaded artifacts and publishes it
        # via PyPI's Trusted Publishing flow (OIDC, no API token).
        attestations: true

  prune-api-compat:
    name: Open post-tag API allowlist prune PR
    needs: [resolve-release, publish]
    runs-on: ubuntu-latest
    # This job uses its repository-write permission only for the generated
    # automation branch; the script never pushes main directly.
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-release.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install package for API inspection
      run: python -m pip install --disable-pip-version-check --editable .

    - name: Resolve previous stable API baseline
      id: baseline
      run: |
        set -euo pipefail
        current_tag="$RELEASE_TAG"
        current_sha=$(git rev-list -n 1 "$current_tag")
        previous_tag=""
        while IFS= read -r tag; do
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
            [ "$(git rev-list -n 1 "$tag")" != "$current_sha" ]; then
            previous_tag="$tag"
            break
          fi
        done < <(git tag --sort=-version:refname --merged "$current_sha")
        if [ -z "$previous_tag" ]; then
          echo "No previous stable release tag found before $current_tag." >&2
          echo "Fetch complete tag history or create a prior stable tag, then rerun the release." >&2
          exit 1
        fi
        echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
        if [[ "$current_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "baseline_ref=$current_tag" >> "$GITHUB_OUTPUT"
        else
          echo "baseline_ref=$previous_tag" >> "$GITHUB_OUTPUT"
        fi

    - name: Prune stale entries from immutable release tag
      run: |
        python scripts/audit_public_api_compat.py \
          --baseline-ref "${{ steps.baseline.outputs.baseline_ref }}" \
          --prune

    - name: Create or safely reuse automation branch and PR
      env:
        GH_TOKEN: ${{ github.token }}
        AUTOMATION_BRANCH: automation/api-compat-prune-${{ needs.resolve-release.outputs.release_tag }}
      run: |
        set -euo pipefail
        if git diff --quiet -- scripts/api-compat-allowlist.json; then
          echo "No stale API-compat entries found; no prune PR is needed."
          exit 0
        fi
        if git show origin/main:scripts/api-compat-allowlist.json |
          cmp -s - scripts/api-compat-allowlist.json; then
          echo "Main already contains this exact pruned allowlist; no duplicate PR is needed."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add scripts/api-compat-allowlist.json
        git commit -m "chore(api): prune stale compatibility allowances"
        generated_tree=$(git rev-parse HEAD^{tree})

        existing_commit=$(git ls-remote --quiet origin "refs/heads/$AUTOMATION_BRANCH" | awk 'NR == 1 {print $1}')
        if [ -n "$existing_commit" ]; then
          git fetch --no-tags origin "refs/heads/$AUTOMATION_BRANCH:refs/remotes/origin/$AUTOMATION_BRANCH"
          existing_tree=$(git rev-parse "refs/remotes/origin/$AUTOMATION_BRANCH^{tree}")
          if [ "$existing_tree" != "$generated_tree" ]; then
            echo "Automation branch $AUTOMATION_BRANCH exists with a different tree." >&2
            echo "Review or remove that human-modified branch, then rerun; no force-push was attempted." >&2
            exit 1
          fi
          pr_count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AUTOMATION_BRANCH" --base main --state open --json number --jq 'length')
          if [ "$pr_count" -eq 0 ]; then
            echo "Automation branch $AUTOMATION_BRANCH already exists, but no open PR was found." >&2
            echo "Open the matching PR or remove the stale automation branch, then rerun." >&2
            exit 1
          fi
          echo "Reused identical automation branch and existing PR for $AUTOMATION_BRANCH."
          exit 0
        fi

        gh auth setup-git
        git branch "$AUTOMATION_BRANCH"
        if ! git push origin "refs/heads/$AUTOMATION_BRANCH"; then
          echo "Automation branch appeared during creation; verifying its contents."
          git fetch --no-tags origin "refs/heads/$AUTOMATION_BRANCH:refs/remotes/origin/$AUTOMATION_BRANCH"
          existing_tree=$(git rev-parse "refs/remotes/origin/$AUTOMATION_BRANCH^{tree}")
          if [ "$existing_tree" != "$generated_tree" ]; then
            echo "Automation branch $AUTOMATION_BRANCH exists with a different tree." >&2
            echo "Review or remove that human-modified branch, then rerun; no force-push was attempted." >&2
            exit 1
          fi
          pr_count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AUTOMATION_BRANCH" --base main --state open --json number --jq 'length')
          if [ "$pr_count" -eq 0 ]; then
            echo "Automation branch $AUTOMATION_BRANCH already exists, but no open PR was found." >&2
            echo "Open the matching PR or remove the stale automation branch, then rerun." >&2
            exit 1
          fi
          echo "Reused identical automation branch and existing PR for $AUTOMATION_BRANCH."
          exit 0
        fi
        gh pr create \
          --repo "$GITHUB_REPOSITORY" \
          --head "$AUTOMATION_BRANCH" \
          --base main \
          --title "chore(api): prune stale compatibility allowances for $RELEASE_TAG" \
          --body "Automated post-tag cleanup for $RELEASE_TAG. This PR removes only allowlist entries that are stale against the immutable release tag; review and merge it before the next release."
