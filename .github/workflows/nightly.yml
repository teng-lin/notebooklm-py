name: Nightly E2E Tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Specific pytest node ID (empty runs the full E2E suite)'
        required: false
        default: ''
      account_rotation_base:
        description: 'Account-rotation base; lane offsets still apply'
        required: true
        type: choice
        default: auto
        options: [auto, A, B, C]
      run_compatibility:
        description: 'Also run the full 3-OS by 5-Python compatibility matrix'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # This no-secret job is the only place a mutable ref is resolved. Only main
  # is trusted for the protected CI account pool.
  resolve-target:
    runs-on: ubuntu-latest
    if: github.repository == 'teng-lin/notebooklm-py'
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      is_standard: ${{ steps.resolve.outputs.is_standard }}
      sha: ${{ steps.target.outputs.sha }}
      short_sha: ${{ steps.target.outputs.short_sha }}
    steps:
    - name: Resolve trusted target
      id: resolve
      env:
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF_VALUE: ${{ github.ref }}
      shell: bash
      run: |
        set -euo pipefail
        echo "branch=main" >> "$GITHUB_OUTPUT"
        if [ "$EVENT_NAME" = schedule ] || [ "$GITHUB_REF_VALUE" = refs/heads/main ]; then
          echo "is_standard=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_standard=false" >> "$GITHUB_OUTPUT"
          echo "::error::Authenticated nightly runs accept only refs/heads/main"
        fi
    - uses: actions/checkout@v7
      if: steps.resolve.outputs.is_standard == 'true'
      with:
        ref: refs/heads/main
        fetch-depth: 1
        persist-credentials: false
    - name: Resolve immutable commit
      id: target
      if: steps.resolve.outputs.is_standard == 'true'
      shell: bash
      run: |
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

  # The reviewed selector runs from the resolved SHA without any secret. Its
  # matrix contains aliases and allowlisted secret names, never secret values.
  plan-live-lanes:
    needs: resolve-target
    if: >-
      github.repository == 'teng-lin/notebooklm-py' &&
      needs.resolve-target.outputs.is_standard == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-target.outputs.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Select live account slots
      id: plan
      env:
        ENABLED_SLOTS: ${{ vars.NOTEBOOKLM_CI_ACCOUNT_SLOTS }}
        MANUAL_BASE: ${{ inputs.account_rotation_base || 'auto' }}
      shell: bash
      run: |
        set -euo pipefail
        rotation_day=$(date -u +%F)
        python scripts/select_ci_account.py \
          --enabled-slots "$ENABLED_SLOTS" \
          --lane nightly-web-windows \
          --rotation-day "$rotation_day" \
          --manual-base "$MANUAL_BASE" \
          --github-output "$RUNNER_TEMP/web-slot.out"
        python scripts/select_ci_account.py \
          --enabled-slots "$ENABLED_SLOTS" \
          --lane nightly-android-windows \
          --rotation-day "$rotation_day" \
          --manual-base "$MANUAL_BASE" \
          --github-output "$RUNNER_TEMP/android-slot.out"
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        def read_outputs(name: str) -> dict[str, str]:
            text = (Path(os.environ["RUNNER_TEMP"]) / name).read_text(encoding="utf-8")
            return dict(line.split("=", 1) for line in text.splitlines() if "=" in line)

        web = read_outputs("web-slot.out")
        android = read_outputs("android-slot.out")
        matrix = {
            "include": [
                {"os": "windows-latest", "backend": "web", "lane": "nightly-web-windows",
                 "account_slot": web["account_slot"],
                 "master_token_secret_name": web["master_token_secret_name"]},
                {"os": "windows-latest", "backend": "android",
                 "lane": "nightly-android-windows", "account_slot": android["account_slot"],
                 "master_token_secret_name": android["master_token_secret_name"]},
            ]
        }
        value = json.dumps(matrix, separators=(",", ":"))
        with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
            stream.write(f"matrix={value}\n")
        PY

  compatibility:
    name: Compatibility (${{ needs.resolve-target.outputs.branch }}@${{ needs.resolve-target.outputs.short_sha }}/${{ matrix.os }}/Python ${{ matrix.python-version }})
    needs: resolve-target
    if: >-
      needs.resolve-target.outputs.is_standard == 'true' &&
      (github.event_name == 'schedule' || inputs.run_compatibility)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    concurrency:
      group: nightly-compatibility-${{ needs.resolve-target.outputs.branch }}-${{ matrix.os }}-${{ matrix.python-version }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-target.outputs.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # @ v7.0.0
    - name: Install compatibility dependencies
      run: >-
        uv sync --frozen --extra browser --extra dev --extra markdown
        --extra mcp --extra server --extra impersonate --extra cookies
    - name: Assert native optional dependencies import
      run: >-
        uv run python -c "import curl_cffi, rookie_cookies;
        assert callable(rookie_cookies.load)"
    - name: Run compatibility tests without coverage
      run: >-
        uv run pytest -n auto --dist loadgroup
        -m "not repo_lint and not requires_playwright and not requires_chromium"
        --no-cov

  coverage:
    name: Coverage (${{ needs.resolve-target.outputs.branch }}@${{ needs.resolve-target.outputs.short_sha }})
    needs: resolve-target
    if: needs.resolve-target.outputs.is_standard == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-target.outputs.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # @ v7.0.0
    - name: Install dependencies
      run: >-
        uv sync --frozen --extra browser --extra dev --extra markdown
        --extra mcp --extra server --extra impersonate --extra cookies
    - name: Install Playwright browsers
      run: uv run playwright install chromium
    - name: Install Playwright system dependencies (Linux)
      run: uv run playwright install-deps chromium
    - name: Run ordinary tests with coverage
      run: >-
        uv run pytest -n auto --dist loadgroup
        -m "not repo_lint and not requires_playwright and not requires_chromium"
        --cov=src/notebooklm --cov-report= --cov-fail-under=0
    - name: Append Playwright-dependent unit coverage
      run: >-
        uv run pytest tests/unit
        -m "(requires_playwright or requires_chromium) and not reality"
        -n 0 --cov=src/notebooklm --cov-append
        --cov-report=term-missing --cov-report=json:coverage.json
        --cov-fail-under=90
    - name: Assert per-file coverage floors
      run: uv run python scripts/check_coverage_thresholds.py --coverage-json coverage.json

  repo-lint:
    name: Repository Lint (${{ needs.resolve-target.outputs.branch }}@${{ needs.resolve-target.outputs.short_sha }})
    needs: resolve-target
    if: needs.resolve-target.outputs.is_standard == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-target.outputs.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # @ v7.0.0
    - name: Install dependencies
      run: >-
        uv sync --frozen --extra browser --extra dev --extra markdown
        --extra mcp --extra server --extra impersonate --extra cookies
    - name: Run repository lint tests
      run: >-
        uv run pytest -n auto --dist loadgroup -m repo_lint
        --timeout=180 --no-cov

  e2e:
    name: E2E (${{ matrix.backend }}/${{ matrix.lane }}/${{ matrix.account_slot }})
    needs: [resolve-target, plan-live-lanes]
    if: >-
      github.repository == 'teng-lin/notebooklm-py' &&
      needs.resolve-target.outputs.is_standard == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    environment: protected-readonly
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-live-lanes.outputs.matrix) }}
    concurrency:
      group: notebooklm-account-${{ matrix.account_slot }}
      queue: max
    env:
      NOTEBOOKLM_BACKEND: ${{ matrix.backend }}
      NOTEBOOKLM_HOME: ${{ runner.temp }}/notebooklm-home
      NOTEBOOKLM_PROFILE: ci-${{ matrix.account_slot }}-${{ matrix.lane }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      E2E_COVERAGE_FLOOR_SENTINEL: ${{ github.workspace }}/.e2e-coverage-floor-failed
      CI_E2E_MANIFEST: ${{ runner.temp }}/notebooklm-e2e.json
      CI_E2E_JOURNAL: ${{ runner.temp }}/notebooklm-generation.jsonl
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-target.outputs.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Record job budget origin
      id: job_start
      run: |
        python - <<'PY'
        import os
        import time
        from pathlib import Path
        with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
            stream.write(f"NOTEBOOKLM_CI_JOB_STARTED_MONOTONIC_NS={time.monotonic_ns()}\n")
        PY
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # @ v7.0.0
    - name: Install dependencies
      run: >-
        uv sync --frozen --extra browser --extra dev --extra markdown
        --extra impersonate --extra mcp --extra server --extra headless --extra android
    - name: Get Playwright version
      id: playwright-version
      run: |
        VERSION=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.playwright-browsers
        key: playwright-${{ matrix.os }}-${{ steps.playwright-version.outputs.version }}-ws
    - name: Install Playwright browsers
      run: uv run playwright install chromium
    - name: Materialize selected account
      id: auth
      if: >-
        needs.resolve-target.outputs.is_standard == 'true' &&
        github.repository == 'teng-lin/notebooklm-py'
      continue-on-error: true
      env:
        NOTEBOOKLM_MASTER_TOKEN_JSON: ${{ secrets[matrix.master_token_secret_name] }}
      run: >-
        uv run python scripts/materialize_ci_auth.py
        --account-slot "${{ matrix.account_slot }}" --profile "$NOTEBOOKLM_PROFILE"
    - name: Sweep stale managed copies
      id: sweep
      if: steps.auth.outcome == 'success'
      continue-on-error: true
      env:
        NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID }}
      run: >-
        uv run python scripts/manage_ci_e2e_notebooks.py sweep
        --backend "${{ matrix.backend }}"
        --template-id-env NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID
        --manifest "$CI_E2E_MANIFEST"
    - name: Provision managed role copies
      id: provision
      if: steps.auth.outcome == 'success' && steps.sweep.outcome == 'success'
      continue-on-error: true
      env:
        NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID }}
      run: >-
        uv run python scripts/manage_ci_e2e_notebooks.py provision
        --backend "${{ matrix.backend }}"
        --template-id-env NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID
        --contract tests/fixtures/e2e_template_contract.json
        --prepared-contract tests/fixtures/e2e_prepared_role_contract.json
        --mode full --lane "${{ matrix.lane }}"
        --account-slot "${{ matrix.account_slot }}"
        --manifest "$CI_E2E_MANIFEST" --github-env "$GITHUB_ENV"
    - name: Backend preflight
      id: preflight
      if: steps.provision.outcome == 'success'
      continue-on-error: true
      run: |
        uv run python - <<'PY'
        import asyncio
        import os
        import gpsoauth  # noqa: F401
        import grpc  # noqa: F401
        from notebooklm import NotebookLMClient
        async def main() -> None:
            backend = os.environ["NOTEBOOKLM_BACKEND"]
            notebook_id = os.environ["NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID"]
            async with NotebookLMClient.from_storage(backend=backend) as client:
                if set(client.backends.values()) != {backend}:
                    raise RuntimeError("Selected backend graph is inconsistent")
                notebook = await client.notebooks.get(notebook_id)
                if notebook.id != notebook_id:
                    raise RuntimeError("Backend preflight returned the wrong managed copy")
        asyncio.run(main())
        PY
    - name: Configure generation journal policy
      id: journal_policy
      if: steps.preflight.outcome == 'success'
      continue-on-error: true
      env:
        TEST_FILTER: ${{ inputs.test_filter }}
      run: |
        if [ "${{ matrix.backend }}" = web ] && [ -z "$TEST_FILTER" ]; then
          umask 077
          : > "$CI_E2E_JOURNAL"
          echo "NOTEBOOKLM_E2E_GENERATION_JOURNAL_MODE=required" >> "$GITHUB_ENV"
          echo "NOTEBOOKLM_E2E_GENERATION_JOURNAL=$CI_E2E_JOURNAL" >> "$GITHUB_ENV"
        else
          echo "NOTEBOOKLM_E2E_GENERATION_JOURNAL_MODE=off" >> "$GITHUB_ENV"
        fi
    - name: Run primary E2E tests
      id: primary
      if: steps.journal_policy.outcome == 'success'
      continue-on-error: true
      env:
        E2E_ENFORCE_COVERAGE_FLOOR: "1"
        TEST_FILTER: ${{ inputs.test_filter }}
      run: |
        python -c 'from pathlib import Path; import os; Path(os.environ["E2E_COVERAGE_FLOOR_SENTINEL"]).unlink(missing_ok=True)'
        if [ -n "$TEST_FILTER" ]; then
          unset E2E_ENFORCE_COVERAGE_FLOOR
          uv run pytest -s -v --tb=short --reruns 1 --reruns-delay 30 -- "$TEST_FILTER"
        else
          uv run pytest tests/e2e -m "not variants" -s -v --tb=short --reruns 1 --reruns-delay 30
        fi
    - name: Validate lastfailed cache
      id: lastfailed
      if: steps.primary.outcome == 'failure'
      continue-on-error: true
      run: test -f .pytest_cache/v/cache/lastfailed
    - name: Retry failed E2E tests after 10-min cool-down
      id: retry
      if: steps.primary.outcome == 'failure' && steps.lastfailed.outcome == 'success'
      continue-on-error: true
      env:
        E2E_ENFORCE_COVERAGE_FLOOR: "1"
        TEST_FILTER: ${{ inputs.test_filter }}
      run: |
        sleep 600
        if [ -n "$TEST_FILTER" ]; then unset E2E_ENFORCE_COVERAGE_FLOOR; fi
        uv run pytest tests/e2e --last-failed --last-failed-no-failures=none -s -v --tb=short
    - name: curl_cffi transport smoke
      id: smoke
      if: steps.preflight.outcome == 'success' && matrix.backend == 'web'
      continue-on-error: true
      env:
        NOTEBOOKLM_TRANSPORT: curl_cffi
      run: uv run pytest tests/e2e -m impersonate_smoke -s -v --tb=short --reruns 1 --reruns-delay 30
    - name: Enforce coverage floors
      id: coverage
      if: >-
        always() && inputs.test_filter == '' &&
        (steps.primary.outcome == 'success' ||
         (steps.primary.outcome == 'failure' &&
          (steps.retry.outcome == 'success' || steps.retry.outcome == 'failure')))
      continue-on-error: true
      run: |
        sentinel="$E2E_COVERAGE_FLOOR_SENTINEL"
        if [ ! -f "$sentinel" ]; then exit 0; fi
        passed="$(awk -F'\t' '$1=="PASS"{print $2}' "$sentinel" | sort -u)"
        skipped="$(awk -F'\t' '$1=="SKIP"{print $2}' "$sentinel" | sort -u)"
        breach="$(comm -23 <(printf '%s\n' "$skipped" | sed '/^$/d') <(printf '%s\n' "$passed" | sed '/^$/d'))"
        if [ -n "$breach" ]; then
          echo "::error::E2E coverage floor breached"
          printf '  %s\n' "$breach"
          exit 1
        fi
    - name: Compute verifier budget
      id: verifier_budget
      if: >-
        always() && matrix.backend == 'web' && inputs.test_filter == '' &&
        steps.journal_policy.outcome == 'success' &&
        (steps.primary.outcome == 'success' ||
         (steps.primary.outcome == 'failure' &&
          (steps.retry.outcome == 'success' || steps.retry.outcome == 'failure')))
      continue-on-error: true
      run: |
        timeout=$(uv run python scripts/verify_ci_artifacts.py --compute-budget)
        echo "timeout=$timeout" >> "$GITHUB_OUTPUT"
    - name: Verify generation operation journal
      id: verifier
      if: >-
        always() && steps.journal_policy.outcome == 'success' &&
        (steps.primary.outcome == 'success' ||
         (steps.primary.outcome == 'failure' &&
          (steps.retry.outcome == 'success' || steps.retry.outcome == 'failure'))) &&
        steps.verifier_budget.outcome == 'success'
      continue-on-error: true
      run: >-
        uv run python scripts/verify_ci_artifacts.py
        --mode journal --backend web
        --manifest "$CI_E2E_MANIFEST" --role generation
        --journal "$CI_E2E_JOURNAL"
        --timeout "${{ steps.verifier_budget.outputs.timeout }}"
    - name: Cleanup managed role copies
      id: cleanup
      if: always()
      continue-on-error: true
      env:
        NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID }}
      run: >-
        uv run python scripts/manage_ci_e2e_notebooks.py cleanup
        --backend "${{ matrix.backend }}"
        --template-id-env NOTEBOOKLM_E2E_TEMPLATE_NOTEBOOK_ID
        --manifest "$CI_E2E_MANIFEST"
    - name: Purge local credentials and handles
      id: purge
      if: always()
      continue-on-error: true
      run: |
        python - <<'PY'
        import os
        import shutil
        from pathlib import Path
        home = Path(os.environ["NOTEBOOKLM_HOME"])
        if home.exists():
            shutil.rmtree(home)
        for name in ("CI_E2E_JOURNAL", "CI_E2E_MANIFEST"):
            Path(os.environ[name]).unlink(missing_ok=True)
        PY
    - name: Aggregate Web lane outcomes
      if: always() && matrix.backend == 'web'
      run: >-
        uv run python scripts/aggregate_ci_e2e_outcomes.py
        --lane nightly-web-windows --mode full
        --producer ${{ inputs.test_filter == '' && 'required' || 'off' }}
        --phase auth=${{ steps.auth.outcome == 'success' && 'success' || 'failure' }}
        --phase sweep=${{ steps.auth.outcome == 'success' && (steps.sweep.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase provision=${{ steps.sweep.outcome == 'success' && (steps.provision.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase preflight=${{ steps.provision.outcome == 'success' && (steps.preflight.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase journal_policy=${{ steps.preflight.outcome == 'success' && (steps.journal_policy.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase primary=${{ steps.journal_policy.outcome == 'success' && (steps.primary.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase lastfailed=${{ steps.primary.outcome == 'failure' && (steps.lastfailed.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase retry=${{ steps.primary.outcome == 'failure' && steps.lastfailed.outcome == 'success' && (steps.retry.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase smoke=${{ steps.preflight.outcome == 'success' && (steps.smoke.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase coverage=${{ inputs.test_filter == '' && (steps.primary.outcome == 'success' || (steps.primary.outcome == 'failure' && (steps.retry.outcome == 'success' || steps.retry.outcome == 'failure'))) && (steps.coverage.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase verifier=${{ inputs.test_filter == '' && steps.journal_policy.outcome == 'success' && (steps.primary.outcome == 'success' || (steps.primary.outcome == 'failure' && (steps.retry.outcome == 'success' || steps.retry.outcome == 'failure'))) && (steps.verifier_budget.outcome == 'success' && (steps.verifier.outcome == 'success' && 'success' || 'failure') || 'failure') || 'not_applicable' }}
        --phase cleanup=${{ steps.cleanup.outcome == 'success' && 'success' || 'failure' }}
        --phase purge=${{ steps.purge.outcome == 'success' && 'success' || 'failure' }}
    - name: Aggregate Android lane outcomes
      if: always() && matrix.backend == 'android'
      run: >-
        uv run python scripts/aggregate_ci_e2e_outcomes.py
        --lane nightly-android-windows --mode full --producer required
        --phase auth=${{ steps.auth.outcome == 'success' && 'success' || 'failure' }}
        --phase sweep=${{ steps.auth.outcome == 'success' && (steps.sweep.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase provision=${{ steps.sweep.outcome == 'success' && (steps.provision.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase preflight=${{ steps.provision.outcome == 'success' && (steps.preflight.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase journal_policy=${{ steps.preflight.outcome == 'success' && (steps.journal_policy.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase primary=${{ steps.journal_policy.outcome == 'success' && (steps.primary.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase lastfailed=${{ steps.primary.outcome == 'failure' && (steps.lastfailed.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase retry=${{ steps.primary.outcome == 'failure' && steps.lastfailed.outcome == 'success' && (steps.retry.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase coverage=${{ inputs.test_filter == '' && (steps.primary.outcome == 'success' || (steps.primary.outcome == 'failure' && (steps.retry.outcome == 'success' || steps.retry.outcome == 'failure'))) && (steps.coverage.outcome == 'success' && 'success' || 'failure') || 'not_applicable' }}
        --phase cleanup=${{ steps.cleanup.outcome == 'success' && 'success' || 'failure' }}
        --phase purge=${{ steps.purge.outcome == 'success' && 'success' || 'failure' }}
