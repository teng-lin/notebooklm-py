name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    # AND-gate on both the actor (``sender.login``) and the keyword. For the
    # ``issues`` event we additionally require ``issue.user.login`` to match
    # — otherwise an attacker could open an issue with ``@claude`` in the
    # body and wait for ``teng-lin`` to assign it: ``sender`` would then be
    # ``teng-lin`` while the prompt text remains attacker-authored. Keeping
    # the author check pins both the trigger and the prompt to the same
    # trusted account.
    if: |
      github.event.sender.login == 'ngk0125' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.issue.user.login == 'ngk0125' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install notebooklm-py
        run: pip install "notebooklm-py"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251  # @ v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          append_system_prompt: |
            You have full access to the `notebooklm` CLI. It is already installed and authenticated
            via the NOTEBOOKLM_AUTH_JSON environment variable. When asked to do anything with
            NotebookLM (list notebooks, create notebooks, add sources, generate audio/video/quizzes,
            download artifacts, etc.) — use the `notebooklm` CLI directly via Bash. Do not tell the
            user to run commands themselves. Run them and report the results.
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}

