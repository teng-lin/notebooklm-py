name: RPC Health Check

on:
  schedule:
    # Main branch: 7 AM UTC daily (1 hour after main nightly E2E tests)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      custom_branch:
        description: 'Override branch to test (leave empty to test the branch you triggered from)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Determine which branch to test
  resolve-branch:
    runs-on: ubuntu-latest
    if: github.repository == 'teng-lin/notebooklm-py'
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      is_standard: ${{ steps.resolve.outputs.is_standard }}
    steps:
      - name: Resolve target branch
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          CUSTOM_BRANCH: ${{ inputs.custom_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            # Scheduled runs test main only. Release branches are manual.
            TARGET="main"
          else
            if [ -n "$CUSTOM_BRANCH" ]; then
              TARGET="$CUSTOM_BRANCH"
            else
              TARGET="$REF_NAME"
            fi
          fi
          echo "branch=$TARGET" >> "$GITHUB_OUTPUT"
          case "$TARGET" in
            main|release/*)
              echo "is_standard=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "is_standard=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "Resolved branch: $TARGET"

  health-check:
    name: RPC Health Check (${{ needs.resolve-branch.outputs.branch }})
    needs: resolve-branch
    if: needs.resolve-branch.outputs.is_standard == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: rpc-health-${{ needs.resolve-branch.outputs.branch }}
      cancel-in-progress: true
    # Secret-bearing job. ``NOTEBOOKLM_MASTER_TOKEN_JSON`` and friends live only in
    # the ``protected-readonly`` GitHub Environment (issue #1009: relying on
    # repo-level fallback for the scheduled-cron branch broke when those
    # secrets were migrated env-only). Binding the env unconditionally is
    # what gives every trigger — scheduled cron, workflow_dispatch from a
    # maintainer, etc. — access to the same secret values. Workflow_dispatch
    # is still hard-gated by ``needs.resolve-branch.outputs.is_standard``
    # above so a feature-branch dispatch never reaches this job at all.
    # Add a ``required reviewers`` rule on the environment if you want to
    # block workflow_dispatch behind manual approval; scheduled runs would
    # then queue too, so today this env carries no protection rules.
    # See docs/development.md → "Workflow secret gates".
    environment: protected-readonly

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-branch.outputs.branch }}
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # @ v7.0.0

    - name: Install dependencies
      # `uv sync --frozen` reproduces the lockfile-pinned dep tree. The RPC
      # health script (`scripts/check_rpc_health.py`) only needs the core
      # runtime deps — no `[browser]`/`[dev]`/`[markdown]` extras required.
      # `--extra headless` = gpsoauth, required for the layer-4 master-token
      # re-mint that the materialized auth profile below relies on.
      # Retried to ride out transient registry/network blips: a real lockfile
      # problem fails all 3 attempts identically, so this only absorbs flakes
      # — it never masks a genuine resolution error.
      shell: bash
      run: |
        attempt=1; max=3
        until uv sync --frozen --extra headless; do
          if [ "$attempt" -ge "$max" ]; then
            echo "::error::uv sync failed after $max attempts" >&2
            exit 1
          fi
          echo "::warning::uv sync attempt $attempt failed; retrying in $((attempt * 15))s" >&2
          sleep $((attempt * 15))
          attempt=$((attempt + 1))
        done

    # Fail-fast preflight + profile materialization. The empty-secret check
    # surfaces ``::error::`` annotations linked to the secret-config misconfig
    # before the ``continue-on-error`` step swallows the exit code (issue
    # #1009). The write-to-disk part replaces the old inline-env auth: env-var
    # auth never engages the layer-4 master-token re-mint (it only fires when
    # master_token.json sits BESIDE the profile's storage_state.json —
    # src/notebooklm/_auth/session.py), so a rotated cookie secret used to
    # hard-fail the run. The master token is now MANDATORY (empty secret or
    # 3 failed mints both exit 1) — it is the only credential shipped, so
    # there is no snapshot to degrade onto.
    - name: Materialize auth profile
      env:
        NOTEBOOKLM_MASTER_TOKEN_JSON: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
        NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID }}
      shell: bash
      run: |
        if [ -z "${NOTEBOOKLM_MASTER_TOKEN_JSON:-}" ]; then
          echo "::error::NOTEBOOKLM_MASTER_TOKEN_JSON resolved to empty. Env binding or secret config is broken — see docs/development.md → Workflow secret gates."
          exit 1
        fi
        if [ -z "${NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID:-}" ]; then
          echo "::error::NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID resolved to empty."
          exit 1
        fi
        umask 077
        mkdir -p ~/.notebooklm/profiles/default
        printf '%s' "$NOTEBOOKLM_MASTER_TOKEN_JSON" > ~/.notebooklm/profiles/default/master_token.json
        chmod 600 ~/.notebooklm/profiles/default/master_token.json
        # The master token is now the ONLY credential shipped. A cookie
        # snapshot cannot be: Google supersedes __Secure-1PSIDTS on a ~600 s
        # cadence and a superseded value is rejected shortly after, so a
        # secret minted on a workstation is routinely dead before the run
        # starts. A master token does not rotate, so it cannot go stale.
        # The health/drift scripts fetch tokens eagerly, which is exactly why
        # the mint runs here rather than relying on in-run recovery; it also
        # bootstraps storage_state.json when none exists. `unset` is
        # load-bearing: `login` refuses to run while inline env auth is set,
        # and the secret is already on disk.
        unset NOTEBOOKLM_MASTER_TOKEN_JSON
        minted=""
        for attempt in 1 2 3; do
          if uv run notebooklm login --master-token-refresh; then
            minted=1
            break
          fi
          echo "::warning::master-token mint attempt ${attempt} failed."
          if [ "$attempt" -lt 3 ]; then
            # Jitter: nightly's ubuntu/windows legs mint concurrently from the
            # same token, so a fixed backoff would have them retry in lockstep
            # and collide again on whatever throttled the first attempt.
            sleep $((attempt * 15 + RANDOM % 20))
          fi
        done
        # Fatal, unlike before: there is no cookie snapshot left to fall back
        # to, so a failed mint means the job has no credentials at all.
        if [ -z "$minted" ]; then
          echo "::error::master-token mint failed after 3 attempts — no auth available."
          exit 1
        fi
        echo "Auth profile materialized (master token; fresh cookies minted)."

    # Rebrand-host lane state, carried between nightly runs so the lane can
    # report a *state change* rather than re-announcing the same observation
    # forever. Restore-only + a run-scoped save key, because cache entries are
    # immutable: a fixed key would pin the first night's answer permanently.
    #
    # On a cache miss, ``load_rebrand_state`` falls back to the checkout's
    # last-acknowledged status for each capability. A transition acknowledged
    # in that checked-in baseline is not replayed merely because the cache
    # disappeared; a contrary live observation is still reported as new.
    - name: Restore rebrand-host lane state
      uses: actions/cache/restore@v6
      continue-on-error: true
      with:
        path: rebrand-state.json
        key: rpc-rebrand-state-${{ needs.resolve-branch.outputs.branch }}-
        restore-keys: |
          rpc-rebrand-state-${{ needs.resolve-branch.outputs.branch }}-

    # The restored document is the PREVIOUS run's, and it carries a run-scoped
    # ``changed`` flag. Move it into its own slot so it can never be read as
    # tonight's result: the health script writes ``rebrand-state.json`` fresh,
    # so from here on that filename existing MEANS this run produced it. Without
    # this, a script that exits early (``load_auth`` exiting 2 on an auth
    # failure writes no state at all) would leave yesterday's document in place
    # and the detect step would replay yesterday's transition (#2062).
    - name: Move restored rebrand state into the previous-run slot
      shell: bash
      run: |
        if [ -f rebrand-state.json ]; then
          mv rebrand-state.json rebrand-state-prev.json
        fi

    - name: Run RPC Health Check
      id: health
      # Auth comes from the profile materialized above (no inline env-var
      # credential is shipped at all) so the layer-4 re-mint can engage.
      #
      # The rebrand-host lane reads its previous state from the restored-and-
      # renamed ``rebrand-state-prev.json`` and writes this run's state to
      # ``rebrand-state.json``, stamped with ``GITHUB_RUN_ID``. Separate paths
      # plus the stamp are what let the detect step below prove the document it
      # reads is tonight's. The lane is exit-code-free by construction, so it
      # cannot change ``exit_code`` here — see the "Rebrand host" steps below
      # for its own, separately-deduped issues.
      #
      # No ``--base-url``: the nightly stays on the default host so the main,
      # exit-coded signal exercises the host users receive. The flag exists for
      # manual investigation.
      continue-on-error: true
      shell: bash
      env:
        NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID }}
        NOTEBOOKLM_GENERATION_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_GENERATION_NOTEBOOK_ID }}
        TARGET_BRANCH: ${{ needs.resolve-branch.outputs.branch }}
      run: |
        echo "Testing branch: $TARGET_BRANCH"
        set +e
        uv run python scripts/check_rpc_health.py --full \
          --rebrand-state-file rebrand-state.json \
          --rebrand-previous-state-file rebrand-state-prev.json \
          --rebrand-run-id "${GITHUB_RUN_ID}" 2>&1 | tee health-report.txt
        exit_code=${PIPESTATUS[0]}
        echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
        exit "$exit_code"

    - name: Scrub secrets from health-report.txt
      # Defence-in-depth: the script itself avoids printing credential-shaped
      # data, but raw response bodies and exception tracebacks can still
      # surface session/CSRF/cookie material on regressions. We re-run the
      # report through ``notebooklm._logging.scrub_secrets`` before any
      # downstream consumer reads it (Add Summary, Create Issue on …,
      # Upload Report). Idempotent — safe to re-apply on subsequent runs.
      if: always()
      shell: bash
      run: |
        if [ ! -f health-report.txt ]; then
          echo "::warning::health-report.txt not produced; skipping scrub."
          exit 0
        fi
        uv run python - <<'PY'
        from pathlib import Path
        from notebooklm._logging import scrub_secrets

        report = Path("health-report.txt")
        original = report.read_text(encoding="utf-8", errors="replace")
        scrubbed = scrub_secrets(original)
        if scrubbed != original:
            report.write_text(scrubbed, encoding="utf-8")
            # ``abs`` because replacement tokens (``***``) may be longer
            # OR shorter than the redacted secret depending on the
            # pattern, so the raw delta can be negative; the magnitude
            # is what's interesting for sanity-checking the scrub.
            print(
                f"Scrubbed health-report.txt "
                f"(delta {abs(len(original) - len(scrubbed))} chars)."
            )
        else:
            print("No secret-shaped substrings detected in health-report.txt.")
        PY

    - name: Add Summary
      if: always()
      shell: bash
      run: |
        echo "## RPC Health Check Results" >> "$GITHUB_STEP_SUMMARY"
        grep -A 10 "^SUMMARY$" health-report.txt >> "$GITHUB_STEP_SUMMARY" || echo "No summary found" >> "$GITHUB_STEP_SUMMARY"

    # Bundle-drift monitor (capture_rpc_registry.py). NOT a PR gate — it depends
    # on Google's live external JS bundle, which can rotate at any time — so it
    # rides the nightly/issue-filing track here. ``--check`` gates id rotation
    # (ABSENT), ``--check-enums`` gates studio enum CHANGED/STALE (a selectable
    # format renumbered/retired — the #1597 class). NEW/UNPARSED, quota codes and
    # proto assertions print for visibility but never fail. ``continue-on-error``
    # so a drift hit files an issue rather than red-failing the canary outright.
    - name: Run bundle drift monitor
      id: bundle
      # Reads auth from the profile materialized above
      # (build_httpx_cookies_from_storage falls back to the storage_state.json
      # file when the env var is absent). It must stay the DOMAIN-PRESERVING
      # loader: a flat name->value mapping handed to httpx.get(cookies=...)
      # carries no domain, so every cookie is sent to every host in the
      # redirect chain regardless of which auth source fed it — issue #2019.
      continue-on-error: true
      shell: bash
      env:
        HEALTH_EXIT_CODE: ${{ steps.health.outputs.exit_code }}
      run: |
        set +e
        if [ "$HEALTH_EXIT_CODE" = "2" ]; then
          cat > bundle-drift-report.txt <<'EOF'
        AUTHENTICATION FAILURE: bundle drift monitor skipped because the RPC Health Check
        already classified this run as an authentication or infrastructure failure.
          No RPC or studio-enum drift conclusion was drawn.
        EOF
          echo "outcome=authentication" >> "$GITHUB_OUTPUT"
          echo "exit_code=2" >> "$GITHUB_OUTPUT"
          exit 2
        fi
        rm -f bundle-outcome.txt
        uv run python scripts/capture_rpc_registry.py --check --check-enums \
          --outcome-file bundle-outcome.txt 2>&1 \
          | tee bundle-drift-report.txt
        raw_exit_code=${PIPESTATUS[0]}
        if [ -f bundle-outcome.txt ]; then
          read -r outcome < bundle-outcome.txt || outcome=""
        else
          outcome=""
        fi
        case "$outcome" in
          clean) exit_code=0 ;;
          drift) exit_code=1 ;;
          authentication|infrastructure) exit_code=2 ;;
          *)
            outcome="runner-error"
            exit_code=2
            {
              echo
              echo "INFRASTRUCTURE FAILURE: bundle monitor exited before classifying the run."
              echo "Raw command exit: ${raw_exit_code}."
              echo "No RPC or studio-enum drift conclusion was drawn."
            } >> bundle-drift-report.txt
            ;;
        esac
        echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
        echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
        exit "$exit_code"

    - name: Scrub secrets from bundle-drift-report.txt
      # The bundle is public CDN content, but the discovery homepage read is
      # authenticated and a transport error could echo a request URL; scrub
      # before any downstream consumer reads the file (same posture as the
      # health-report scrub above). Idempotent.
      if: always()
      shell: bash
      run: |
        if [ ! -f bundle-drift-report.txt ]; then
          echo "::warning::bundle-drift-report.txt not produced; skipping scrub."
          exit 0
        fi
        uv run python - <<'PY'
        from pathlib import Path
        from notebooklm._logging import scrub_secrets

        report = Path("bundle-drift-report.txt")
        original = report.read_text(encoding="utf-8", errors="replace")
        scrubbed = scrub_secrets(original)
        if scrubbed != original:
            report.write_text(scrubbed, encoding="utf-8")
            print(f"Scrubbed bundle-drift-report.txt (delta {abs(len(original) - len(scrubbed))} chars).")
        else:
            print("No secret-shaped substrings detected in bundle-drift-report.txt.")
        PY

    - name: Check for existing bundle drift issue
      if: steps.bundle.outputs.outcome == 'drift'
      id: dup_bundle
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! count=$(gh issue list --repo "$GITHUB_REPOSITORY" \
          --state open --label automated --label rpc-breakage \
          --search 'in:title "Studio enum / RPC drift detected"' \
          --json number --jq 'length'); then
          echo "::warning::Bundle drift dedup probe failed; allowing issue creation"
          count=0
        fi
        echo "open=${count}" >> "$GITHUB_OUTPUT"

    - name: Create Issue on bundle drift
      if: |
        steps.bundle.outputs.outcome == 'drift'
        && steps.dup_bundle.outputs.open == '0'
      uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # @ v6.0.0
      with:
        title: "Studio enum / RPC drift detected"
        content-filepath: bundle-drift-report.txt
        labels: rpc-breakage, automated

    - name: Upload bundle drift report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rpc-bundle-drift-report
        path: bundle-drift-report.txt
        retention-days: 30

    # Each issue-creating step is paired with a dedup probe that counts
    # open issues sharing the same title + automated label. Without this,
    # back-to-back failing runs (manual reruns, cron + workflow_dispatch)
    # farm one fresh issue per run instead of letting the open one
    # accumulate context.
    - name: Check for existing RPC Mismatch issue
      if: steps.health.outputs.exit_code == '1'
      id: dup_mismatch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! count=$(gh issue list --repo "$GITHUB_REPOSITORY" \
          --state open --label automated --label rpc-breakage \
          --search 'in:title "RPC ID Mismatch Detected"' \
          --json number --jq 'length'); then
          echo "::warning::RPC mismatch dedup probe failed; allowing issue creation"
          count=0
        fi
        echo "open=${count}" >> "$GITHUB_OUTPUT"

    - name: Create Issue on RPC Mismatch
      if: |
        steps.health.outputs.exit_code == '1'
        && steps.dup_mismatch.outputs.open == '0'
      uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # @ v6.0.0
      with:
        title: "RPC ID Mismatch Detected"
        content-filepath: health-report.txt
        labels: bug, rpc-breakage, automated

    - name: Prepare authentication failure report
      if: |
        steps.health.outputs.exit_code == '2'
        || steps.bundle.outputs.exit_code == '2'
      shell: bash
      run: |
        {
          echo "RPC health authentication/infrastructure failure"
          echo
          if [ "${{ steps.health.outputs.exit_code }}" = "2" ]; then
            echo "--- RPC health check ---"
            cat health-report.txt
          fi
          if [ "${{ steps.bundle.outputs.exit_code }}" = "2" ]; then
            echo
            echo "--- Bundle discovery ---"
            cat bundle-drift-report.txt
          fi
        } > auth-failure-report.txt

    - name: Check for existing Auth Failure issue
      if: |
        steps.health.outputs.exit_code == '2'
        || steps.bundle.outputs.exit_code == '2'
      id: dup_auth
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! count=$(gh issue list --repo "$GITHUB_REPOSITORY" \
          --state open --label automated \
          --search 'in:title "RPC Health Check: Authentication Failure"' \
          --json number --jq 'length'); then
          echo "::warning::Auth failure dedup probe failed; allowing issue creation"
          count=0
        fi
        echo "open=${count}" >> "$GITHUB_OUTPUT"

    - name: Create Issue on Auth Failure
      if: |
        (steps.health.outputs.exit_code == '2' || steps.bundle.outputs.exit_code == '2')
        && steps.dup_auth.outputs.open == '0'
      uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # @ v6.0.0
      with:
        title: "RPC Health Check: Authentication Failure"
        content-filepath: auth-failure-report.txt
        labels: bug, automated

    - name: Check for existing non-transient ERROR issue
      if: steps.health.outputs.exit_code == '3'
      id: dup_error
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! count=$(gh issue list --repo "$GITHUB_REPOSITORY" \
          --state open --label automated --label rpc-error \
          --search 'in:title "RPC Health Check: Non-transient ERROR detected"' \
          --json number --jq 'length'); then
          echo "::warning::Non-transient ERROR dedup probe failed; allowing issue creation"
          count=0
        fi
        echo "open=${count}" >> "$GITHUB_OUTPUT"

    - name: Extract failing methods for ERROR issue
      if: |
        steps.health.outputs.exit_code == '3'
        && steps.dup_error.outputs.open == '0'
      id: error_details
      shell: bash
      run: |
        # Pull the affected-methods list out of the RESULT line emitted by the script.
        affected=$(grep -m1 "non-transient ERROR detected in methods:" health-report.txt \
          | sed -E 's/.*methods: //' || true)
        if [ -z "$affected" ]; then
          affected="(see report)"
        fi
        {
          echo "## Non-transient ERROR detected"
          echo ""
          echo "**Affected methods:** ${affected}"
          echo ""
          echo "**Commit:** ${GITHUB_SHA}"
          echo ""
          echo "Full report attached below (rate-limit / \`RESOURCE_EXHAUSTED\` errors"
          echo "are filtered out — anything listed here is a real failure that needs"
          echo "investigation: timeouts, parse failures, unexpected HTTP errors)."
          echo ""
          echo "---"
          echo ""
          cat health-report.txt
        } > error-issue-body.md

    - name: Create Issue on Non-transient ERROR
      if: |
        steps.health.outputs.exit_code == '3'
        && steps.dup_error.outputs.open == '0'
      uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # @ v6.0.0
      with:
        title: "RPC Health Check: Non-transient ERROR detected"
        content-filepath: error-issue-body.md
        labels: rpc-error, bug, automated

    # Exit code 4 = the ``sqTeoe`` studio option-table cross-check found DRIFT:
    # GetArtifactCustomizationChoices served audio / video / slide-deck format
    # codes or labels that disagree with the client's AudioFormat / VideoFormat /
    # SlideDeckFormat enums (#1597 class). MATCH is the steady state and never
    # reaches this branch (#2284 replaced the earlier never-firing probe).
    - name: Check for existing customization-drift issue
      if: steps.health.outputs.exit_code == '4'
      id: dup_customization
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! count=$(gh issue list --repo "$GITHUB_REPOSITORY" \
          --state open --label automated --label rpc-breakage \
          --search 'in:title "Studio customization table drifted"' \
          --json number --jq 'length'); then
          echo "::warning::Customization-drift dedup probe failed; allowing issue creation"
          count=0
        fi
        echo "open=${count}" >> "$GITHUB_OUTPUT"

    - name: Create Issue on customization drift
      if: |
        steps.health.outputs.exit_code == '4'
        && steps.dup_customization.outputs.open == '0'
      uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # @ v6.0.0
      with:
        title: "Studio customization table drifted — re-capture format enums"
        content-filepath: health-report.txt
        labels: rpc-breakage, automated

    # Exit code 5 = the pinned frontend build label (``_env.DEFAULT_BL``) trails
    # the label the app shell serves by more than the freshness window. Chat is
    # not broken by this — the server does not validate the value today — but the
    # constant has gone unattended, which is how it reached five months of drift
    # unnoticed (#2073). Bumping it clears the signal; ordinary week-to-week drift
    # exits 0 and never reaches this branch.
    - name: Check for existing stale-build-label issue
      if: steps.health.outputs.exit_code == '5'
      id: dup_build_label
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! count=$(gh issue list --repo "$GITHUB_REPOSITORY" \
          --state open --label automated --label rpc-breakage \
          --search 'in:title "Pinned frontend build label is stale"' \
          --json number --jq 'length'); then
          echo "::warning::Stale-build-label dedup probe failed; allowing issue creation"
          count=0
        fi
        echo "open=${count}" >> "$GITHUB_OUTPUT"

    - name: Create Issue on stale build label
      if: |
        steps.health.outputs.exit_code == '5'
        && steps.dup_build_label.outputs.open == '0'
      uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # @ v6.0.0
      with:
        title: "Pinned frontend build label is stale — bump DEFAULT_BL"
        content-filepath: health-report.txt
        labels: rpc-breakage, automated

    # ------------------------------------------------------------------
    # Rebrand-host lane (notebook.google.com) — SEPARATE from everything
    # above. It has no exit code: the script keeps its probes out of
    # ``compute_exit_code`` entirely. That separation is the whole point.
    # The main "Non-transient ERROR detected" issue is deduped by TITLE
    # ALONE, so a rebrand probe reported through it would open one issue on
    # the first failing night and then suppress every main-lane degradation
    # issue after it — disabling the very gate this lane feeds.
    #
    # This lane therefore has: its own titles, its own PER-CAPABILITY dedup
    # keys, and a state-change trigger (for example, PRESENT -> ABSENT) rather
    # than a recurring error. An unchanged capability files nothing.
    #
    # Step order matters: detect -> report -> save. The cached state is the
    # baseline the NEXT run compares against, so it may only be advanced once
    # every transition it absorbs has actually been reported.
    # ------------------------------------------------------------------
    - name: Detect rebrand-host state change
      id: rebrand
      if: always()
      shell: bash
      run: |
        if [ ! -f rebrand-state.json ]; then
          echo "::warning::rebrand-state.json not produced; rebrand lane reported nothing."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # A malformed state file must not fail the job: this lane is advisory.
        if ! uv run python - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        import os
        from pathlib import Path

        state = json.loads(Path("rebrand-state.json").read_text(encoding="utf-8"))
        stamp = state.get("run_id")
        expected = os.environ["GITHUB_RUN_ID"]
        if stamp != expected:
            # Belt-and-braces with the previous-run slot rename above: the
            # ``changed`` flag is RUN-SCOPED, so only a document this run wrote
            # may be read as this run's result. A restored-but-not-rewritten
            # file would otherwise replay a transition that did not happen.
            # stdout is the step's output file here, so the annotation is
            # handed back to bash to emit.
            Path("rebrand-detect-warning.txt").write_text(
                f"::warning::rebrand-state.json is stamped {stamp!r}, not this "
                f"run ({expected!r}); treating the lane as unchanged.\n",
                encoding="utf-8",
            )
            print("changed=false")
        else:
            print(f"changed={'true' if state.get('changed') else 'false'}")
        PY
        then
          echo "::warning::rebrand-state.json unreadable; treating the lane as unchanged."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi
        if [ -s rebrand-detect-warning.txt ]; then
          cat rebrand-detect-warning.txt
        fi
        {
          echo "## Rebrand-host lane"
          echo ""
          grep '^REBRAND' health-report.txt || echo "(no rebrand lane output)"
        } >> "$GITHUB_STEP_SUMMARY"

    # One issue PER CAPABILITY, and a comment when that capability's issue is
    # already open. A single shared dedup key would let a ``chat`` transition be
    # suppressed by an open ``batchexecute`` issue — and because the new state
    # becomes the cached baseline, the next run would see no change, so the
    # suppressed transition would never be reported at all. Commenting rather
    # than dropping keeps that true even for a repeat transition on the same
    # capability. ``gh`` rather than the pinned create-issue action because the
    # title is per-capability and the update path needs ``issue comment``.
    - name: Report rebrand-host state changes
      id: rebrand_report
      if: always() && steps.rebrand.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -uo pipefail
        failed=false
        if ! uv run python - <<'PY' > rebrand-transitions.tsv
        import json
        from pathlib import Path

        doc = json.loads(Path("rebrand-state.json").read_text(encoding="utf-8"))
        for transition in doc.get("transitions", []):
            row = [str(transition.get(key, "?")) for key in ("capability", "from", "to")]
            print("\t".join(cell.replace("\t", " ") for cell in row))
        PY
        then
          # Unreadable here but readable in the detect step means a race or a
          # truncated write. Fail loudly rather than advancing the baseline past
          # transitions we never enumerated.
          echo "::warning::Could not read rebrand transitions; nothing reported."
          failed=true
        fi
        while IFS=$'\t' read -r capability from_state to_state; do
          [ -n "$capability" ] || continue
          TITLE="Rebrand host RPC availability changed: ${capability}"
          {
            echo "## Rebrand host (notebook.google.com): \`${capability}\` ${from_state} -> ${to_state}"
            echo ""
            echo "**Commit:** ${GITHUB_SHA}"
            echo ""
            echo "This is the rebrand-host lane of the nightly RPC health check. It"
            echo "carries NO exit code and is independent of the exit-coded main signal;"
            echo "the main lane's issues are unaffected by anything reported here."
            echo ""
            grep '^REBRAND' health-report.txt || echo "(no rebrand lane output)"
            echo ""
            echo "### Still unanswered"
            echo ""
            echo "The \`/upload/_/\` (Scotty) sub-question is NOT probed by this"
            echo "workflow: \`check_rpc_health.py\` exercises \`ADD_SOURCE_FILE\` as an"
            echo "RPC only and issues no upload POST anywhere. Answering it needs a"
            echo "manual authenticated capture (upload-session start only, no bytes),"
            echo "scrubbed via \`tests/cassette_patterns.py\` before it leaves the machine."
            echo ""
            echo "A PRESENT verdict is evidence the host served the endpoint from these"
            echo "credentials. ABSENT means a non-auth, non-transient response did not"
            echo "demonstrate it. Neither verdict alone is a reason to change any default."
          } > rebrand-issue-body.md
          if ! existing=$(TITLE="$TITLE" gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label automated \
            --search 'in:title "Rebrand host RPC availability changed"' \
            --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty'); then
            echo "::warning::Rebrand-host dedup probe failed for ${capability}; creating a new issue"
            existing=""
          fi
          if [ -n "$existing" ]; then
            echo "Rebrand issue #${existing} already open for ${capability}; commenting."
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body-file rebrand-issue-body.md || failed=true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --label automated --body-file rebrand-issue-body.md || failed=true
          fi
        done < rebrand-transitions.tsv
        if [ "$failed" = true ]; then
          echo "::warning::A rebrand-host transition could not be reported; not advancing the cached baseline."
        fi
        echo "report_failed=${failed}" >> "$GITHUB_OUTPUT"

    # Saved LAST, and only when this run both produced a state document and
    # managed to report whatever it observed. Caching an unreported transition
    # would bake it into the baseline and lose it permanently.
    - name: Save rebrand-host lane state
      if: |
        always()
        && hashFiles('rebrand-state.json') != ''
        && steps.rebrand_report.outputs.report_failed != 'true'
        && steps.rebrand_report.outcome != 'failure'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: rebrand-state.json
        # Run-scoped key: cache entries are immutable, so a fixed key would
        # freeze the first night's answer forever. The restore step matches
        # this by prefix and picks the most recent.
        key: rpc-rebrand-state-${{ needs.resolve-branch.outputs.branch }}-${{ github.run_id }}

    - name: Upload Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rpc-health-report
        path: health-report.txt
        retention-days: 30

    - name: Fail if health check failed
      if: steps.health.outcome == 'failure'
      run: |
        echo "RPC Health Check failed (exit code: ${{ steps.health.outputs.exit_code }}). See report above."
        exit 1

  # ------------------------------------------------------------------
  # Android gRPC canary — a light, READ-ONLY probe of the private Android
  # gRPC backend: bearer mint plus
  # one forced refresh, unary GetProject, unary ListChatSessions, and a
  # strict protobuf decode that fingerprints each response's shape and
  # fails on any unknown field (``scripts/android_grpc_canary.py``). It is
  # deliberately separate from the heavy Android E2E lane in nightly.yml,
  # never writes to the notebook, and never rewrites a cassette or fixture.
  #
  # Independent of ``health-check`` above: its own concurrency group, its
  # own report file, and no shared step outputs, so a Web-lane failure and
  # an Android-lane failure are always two distinct red jobs. A FAIL line
  # is the whole signal — the job goes red; nothing files an issue yet.
  # The step summary carries the OK/FAIL/SHAPE lines for triage.
  # ------------------------------------------------------------------
  android-grpc-health:
    name: Android gRPC Canary (${{ needs.resolve-branch.outputs.branch }})
    needs: resolve-branch
    if: needs.resolve-branch.outputs.is_standard == 'true'
    runs-on: ubuntu-latest
    # A hung gpsoauth mint or gRPC connect must not burn the 6 h default.
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: android-grpc-health-${{ needs.resolve-branch.outputs.branch }}
      cancel-in-progress: true
    # Explicit: a red canary must surface as a red job, never be absorbed.
    continue-on-error: false
    # Same unconditional environment binding as ``health-check`` (#1009);
    # a feature-branch workflow_dispatch never reaches this job because of
    # the ``is_standard`` gate above. See docs/development.md → "Workflow
    # secret gates".
    environment: protected-readonly

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-branch.outputs.branch }}
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # @ v7.0.0

    - name: Install dependencies
      # The SAME extras line as the nightly Android E2E lane, so the canary
      # resolves the identical lockfile-pinned dependency tree that lane
      # tests against (grpcio/protobuf/gpsoauth come from `--extra android`;
      # `--extra headless` backs the master-token mint below). Retried to
      # ride out transient registry/network blips only: a real lockfile
      # problem fails all 3 attempts identically.
      shell: bash
      run: |
        attempt=1; max=3
        until uv sync --frozen --extra browser --extra dev --extra markdown --extra impersonate --extra mcp --extra server --extra headless --extra android; do
          if [ "$attempt" -ge "$max" ]; then
            echo "::error::uv sync failed after $max attempts" >&2
            exit 1
          fi
          echo "::warning::uv sync attempt $attempt failed; retrying in $((attempt * 15))s" >&2
          sleep $((attempt * 15))
          attempt=$((attempt + 1))
        done

    # Identical to the nightly Android lane's profile materialization: the
    # master token is the only credential shipped, and the Android bearer
    # is minted from it (src/notebooklm/_android/auth.py) via gpsoauth.
    # The ``login --master-token-refresh`` mint also bootstraps
    # storage_state.json, which ``from_storage`` requires to exist even
    # though the Android backend never sends those cookies.
    - name: Materialize auth profile
      env:
        NOTEBOOKLM_MASTER_TOKEN_JSON: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
        NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID }}
      shell: bash
      run: |
        if [ -z "${NOTEBOOKLM_MASTER_TOKEN_JSON:-}" ]; then
          echo "::error::NOTEBOOKLM_MASTER_TOKEN_JSON resolved to empty. Env binding or secret config is broken — see docs/development.md → Workflow secret gates."
          exit 1
        fi
        if [ -z "${NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID:-}" ]; then
          echo "::error::NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID resolved to empty."
          exit 1
        fi
        umask 077
        mkdir -p ~/.notebooklm/profiles/default
        printf '%s' "$NOTEBOOKLM_MASTER_TOKEN_JSON" > ~/.notebooklm/profiles/default/master_token.json
        chmod 600 ~/.notebooklm/profiles/default/master_token.json
        # `unset` is load-bearing: `login` refuses to run while inline env
        # auth is set, and the secret is already on disk.
        unset NOTEBOOKLM_MASTER_TOKEN_JSON
        minted=""
        for attempt in 1 2 3; do
          if uv run notebooklm login --master-token-refresh; then
            minted=1
            break
          fi
          echo "::warning::master-token mint attempt ${attempt} failed."
          if [ "$attempt" -lt 3 ]; then
            # Jitter: the Web health-check job mints concurrently from the
            # same token, so a fixed backoff would retry in lockstep.
            sleep $((attempt * 15 + RANDOM % 20))
          fi
        done
        if [ -z "$minted" ]; then
          echo "::error::master-token mint failed after 3 attempts — no auth available."
          exit 1
        fi
        echo "Auth profile materialized (master token; fresh cookies minted)."

    - name: Run Android gRPC canary
      # Auth comes from the profile materialized above. The script prints
      # one ``OK``/``FAIL`` line per step plus ``SHAPE <rpc> <sha256>``
      # fingerprints (populated field paths + wire types only — no values,
      # ids, or text) and ``UNKNOWN <rpc> <n>`` counts, and exits non-zero
      # on any failure or on a mismatch against the reviewed baseline.
      #
      # The recovered app protos do not declare every field the server
      # sends (GetProject carries dozens of unknown fields in steady state),
      # so drift is judged against ``tests/fixtures/android/canary_baseline.json``
      # rather than against zero. That file is authored BY HAND from a
      # reviewed run's SHAPE/UNKNOWN lines — the canary never writes it.
      # Until it exists the step prints ``WARN baseline missing`` and runs
      # in diagnostic mode (green), which is what the first run is for. The
      # grace date below bounds that bootstrap: after it, a missing baseline
      # FAILs the job so the drift check cannot stay inert indefinitely.
      shell: bash
      env:
        NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID }}
        TARGET_BRANCH: ${{ needs.resolve-branch.outputs.branch }}
      run: |
        echo "Testing branch: $TARGET_BRANCH"
        set +e
        uv run python scripts/android_grpc_canary.py \
          --baseline tests/fixtures/android/canary_baseline.json \
          --missing-baseline-grace-until 2026-09-14 2>&1 | tee android-canary-report.txt
        exit_code=${PIPESTATUS[0]}
        # Diagnostic mode is green by design, so without this annotation an
        # inert drift check would never be visible from the run list. It does
        # not touch the exit code.
        if grep -q '^WARN baseline missing' android-canary-report.txt; then
          echo "::warning::Android canary running in diagnostic mode: tests/fixtures/android/canary_baseline.json is missing — author it from this run's SHAPE/UNKNOWN lines"
        fi
        exit "$exit_code"

    - name: Scrub secrets from android-canary-report.txt
      # Defence-in-depth, same posture as the Web report scrub above: the
      # script prints only sanitized class names and hashes, but the report
      # is re-scrubbed before the summary step reads it. Idempotent.
      if: always()
      shell: bash
      run: |
        if [ ! -f android-canary-report.txt ]; then
          echo "::warning::android-canary-report.txt not produced; skipping scrub."
          exit 0
        fi
        uv run python - <<'PY'
        from pathlib import Path
        from notebooklm._logging import scrub_secrets

        report = Path("android-canary-report.txt")
        original = report.read_text(encoding="utf-8", errors="replace")
        scrubbed = scrub_secrets(original)
        if scrubbed != original:
            report.write_text(scrubbed, encoding="utf-8")
            print(f"Scrubbed android-canary-report.txt (delta {abs(len(original) - len(scrubbed))} chars).")
        else:
            print("No secret-shaped substrings detected in android-canary-report.txt.")
        PY

    # Summary only — no artifact upload. The OK/FAIL/WARN/SHAPE/UNKNOWN
    # grammar is the entire useful output and it lives in the run's step
    # summary; the SHAPE/UNKNOWN lines are what a reviewer copies into the
    # baseline file.
    - name: Add Summary
      if: always()
      shell: bash
      run: |
        {
          echo "## Android gRPC canary"
          echo ""
          echo '```'
          grep -E '^(OK|FAIL|WARN|SHAPE|UNKNOWN) ' android-canary-report.txt 2>/dev/null || echo "(no canary output)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
