name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      custom_branch:
        description: 'Branch/ref to test (leave empty to use the triggering ref). Use this to run the full gate against a release branch that conflicts with main and so cannot run via pull_request.'
        required: false
        default: ''

concurrency:
  # Include the dispatch input so a manual run against a release branch gets its
  # own group instead of sharing (and cancelling) the push/PR run on the
  # triggering ref. Empty for push/pull_request, so their behavior is unchanged.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.custom_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # Honor the workflow_dispatch custom_branch input; falls back to the
        # triggering ref for push/pull_request (input is empty there).
        ref: ${{ inputs.custom_branch || github.ref }}
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: |
        # Retry to ride out transient registry/network blips during dep
        # resolution: a single PyPI/GitHub hiccup was hard-failing the leg.
        # `uv sync` has no internal retry across the full resolve+download.
        # A real lockfile problem fails all 3 attempts identically, so this
        # only absorbs flakes — it never masks a genuine resolution error.
        attempt=1; max=3
        until uv sync --frozen --extra browser --extra dev --extra markdown; do
          if [ "$attempt" -ge "$max" ]; then
            echo "::error::uv sync failed after $max attempts" >&2
            exit 1
          fi
          echo "::warning::uv sync attempt $attempt failed; retrying in $((attempt * 15))s" >&2
          sleep $((attempt * 15))
          attempt=$((attempt + 1))
        done

    - name: Assert core imports without optional adapter extras
      # This job uses the canonical lean install (browser+dev+markdown, no
      # `mcp`/`server`). Since the test matrix now installs those extras, this
      # is the remaining per-PR guard that the core package still imports
      # without fastmcp/fastapi present — a stray top-level `import fastmcp` in
      # non-adapter code would ImportError here, catching the regression before
      # it reaches the release-time smoke test in publish.yml.
      #
      # `notebooklm_cli` (not `cli.grouped`) is imported because it is the
      # console-script entrypoint that builds the full command tree via
      # `cli.add_command(...)`, including `cli/mcp_cmd.py` — the most likely
      # place a stray `import fastmcp` would land. `cli.grouped` only defines
      # the Click Group subclass and traverses none of the command modules.
      # `client` + `artifacts` cover the primary public Python-API surface
      # (`from notebooklm import NotebookLMClient`). Since the lean install has
      # neither fastmcp nor fastapi, a stray top-level import of either from any
      # core/`_app` module reachable here fails the step. The `notebooklm-server`
      # adapter is intentionally NOT imported: it legitimately requires fastapi
      # (so it can't load on the lean install) and is exercised by the `test`
      # matrix instead — `server` is not wired into the CLI command tree.
      run: uv run python -c "import notebooklm, notebooklm.notebooklm_cli, notebooklm.client, notebooklm.artifacts"

    - name: Verify built base wheel without browser extra
      shell: bash
      run: |
        uv build --wheel --out-dir dist
        wheels=(dist/notebooklm_py-*.whl)
        test "${#wheels[@]}" -eq 1
        uv run python scripts/check_base_wheel.py --wheel "${wheels[0]}"

    - name: Run pre-commit checks
      run: uv run pre-commit run --all-files

    - name: Run type checking
      # `scripts/_live_auth_scenarios` is included deliberately: those modules
      # are the live-auth matrix cells that used to be `python -c` source
      # strings (#2180). Type-checking them is most of the point of extracting
      # them — they cannot be exercised without live Google credentials, so the
      # checker is the only thing standing between a typo and a maintainer's
      # release run. `--ignore-missing-imports` keeps this green on the lean
      # install this job uses (no `mcp`/`server` extras).
      run: >-
        uv run mypy src/notebooklm scripts/_live_auth_scenarios
        scripts/audit_auth_patch_sites.py
        scripts/audit_auth_shared_mutations.py
        scripts/check_auth_behavior_scenario_policy.py
        scripts/check_auth_coverage_delta.py
        scripts/check_auth_lifecycle_cleanup_policy.py
        --ignore-missing-imports

    - name: Assert workflow permissions are scoped
      run: uv run python scripts/check_workflow_permissions.py

    - name: Assert workflow secret-bearing jobs are gated
      # Companion to the permissions check: prevents a new
      # ``${{ secrets.NAME }}`` reference from landing without picking up
      # a job-level ``environment:`` declaration or a step-level
      # ``is_standard`` guard. See docs/development.md →
      # "Workflow secret gates".
      run: uv run python scripts/check_workflow_secret_gates.py

    - name: Assert third-party actions in privileged workflows are SHA-pinned
      # Supply-chain gate: every third-party action (non ``actions/*``) in
      # publish / testpypi-publish / claude / rpc-health / nightly /
      # verify-package must use a 40-char commit SHA, not a floating
      # ``@v1`` / ``@release/v1`` / branch ref. Dependabot bumps the
      # SHAs weekly via the grouped ``actions`` updates in
      # ``.github/dependabot.yml``.
      run: uv run python scripts/check_action_pinning.py

    - name: Assert no deprecation targets the shipping version
      # Release gate: a DeprecationWarning must never name the version in
      # pyproject.toml as its removal target. Lapsed shims are allowlisted
      # inside the script with a tracking issue.
      run: uv run python scripts/check_deprecation_targets.py

    - name: Assert coverage thresholds match
      run: uv run python scripts/check_coverage_thresholds.py

    - name: Assert CI install matches CONTRIBUTING.md
      run: uv run python scripts/check_ci_install_parity.py

    - name: Assert repo-structure map (docs/architecture.md) is fresh
      run: uv run python scripts/check_claude_md_freshness.py

    - name: Assert doc module references are fresh
      # Companion to the CLAUDE.md freshness gate: guards the rest of the docs
      # against stale module paths. Every relative link into src/notebooklm/
      # must resolve, and every inline module ref in the live docs must point at
      # a real module (rare historical mentions are allowlisted, shrink-only).
      run: uv run python scripts/check_docs_module_refs.py

    - name: Audit public API compatibility
      # ``--check-stale`` also fails when an allowlist entry matches no break
      # against the baseline (it is already in the baseline). This forces the
      # allowlist to be pruned at each release boundary instead of silently
      # accumulating cruft. See docs/releasing.md → prune-allowlist-at-release.
      run: uv run python scripts/audit_public_api_compat.py --check-stale

    - name: Assert per-method RPC coverage
      # Static check: each RPCMethod member must have at least one test
      # reference AND at least one cassette body containing its RPC id.
      # Pre-existing gaps are grandfathered via PREEXISTING_GAPS inside the
      # script — that set is a one-way ratchet and must not grow.
      run: uv run python tests/scripts/check_method_coverage.py

    - name: Verify e2e test fixtures
      run: uv run pytest tests/e2e --collect-only -q

    - name: Assert cassettes are sanitized
      # This repository-wide content scan runs once in the quality job instead
      # of once per compatibility cell. ``--strict`` requires the repair
      # allowlist to stay empty; ``--recursive`` includes nested cassettes.
      run: uv run python tests/scripts/check_cassettes_clean.py --strict --recursive

    - name: Check fixtures for credential leaks
      # Golden RPC fixtures carry the same credential-shaped WIZ data as VCR
      # cassettes. Scan their JSON/HTML/YAML once here rather than repeating the
      # filesystem walk across every OS/Python compatibility cell.
      run: uv run python tests/scripts/check_cassettes_clean.py --secrets-only --recursive tests/fixtures tests/unit/fixtures

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux carries the full supported Python range. One 3.12 cell on each
        # secondary OS preserves platform compatibility without multiplying the
        # entire suite into a 3-by-5 bottleneck on every PR; the complete
        # 15-cell product runs nightly (`nightly.yml` → `compatibility`) and on
        # manual nightly dispatches. Canonical Ubuntu 3.12 owns Chromium,
        # external-reality work, and the critical contract guards.
        include:
        - os: ubuntu-latest
          python-version: "3.10"
          canonical: false
          windows_playwright: false
        - os: ubuntu-latest
          python-version: "3.11"
          canonical: false
          windows_playwright: false
        - os: ubuntu-latest
          python-version: "3.12"
          canonical: true
          windows_playwright: false
        - os: ubuntu-latest
          python-version: "3.13"
          canonical: false
          windows_playwright: false
        - os: ubuntu-latest
          python-version: "3.14"
          canonical: false
          windows_playwright: false
        - os: macos-latest
          python-version: "3.12"
          canonical: false
          windows_playwright: false
        - os: windows-latest
          python-version: "3.12"
          canonical: false
          windows_playwright: true
    env:
      # Pin Playwright's browser install dir to a single workspace-relative
      # path on every OS. The previous dual-path cache stanza (``~/.cache``
      # + ``~/AppData/Local``) intermittently failed the cache restore on
      # Windows with ``actions/cache@v5`` — the missing Linux path tripped
      # the post-restore validation on a cache hit. Pinning the path here
      # lets the canonical browser cache stanza below carry exactly one entry.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
    - uses: actions/checkout@v7
      with:
        # Honor the workflow_dispatch custom_branch input; falls back to the
        # triggering ref for push/pull_request (input is empty there).
        ref: ${{ inputs.custom_branch || github.ref }}
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: |
        # Retry to ride out transient registry/network blips during dep
        # resolution: a single PyPI/GitHub hiccup on one compatibility cell can
        # hard-fail the whole required matrix while its siblings pass. `uv sync`
        # has no internal retry across the full resolve+download. A real
        # lockfile problem fails all 3 attempts identically, so this only
        # absorbs flakes — it never masks a genuine resolution error.
        #
        # `mcp` + `server` + `impersonate` are installed here (on top of the
        # canonical browser+dev+markdown set) so the MCP, server, and curl_cffi
        # suites (`tests/unit/mcp`, `tests/integration/mcp_vcr`, `tests/server`,
        # `tests/unit/test_curl_cffi_transport_poc.py`) run in the main matrix
        # instead of being importorskip'd — that gives
        # `src/notebooklm/{mcp,server}/**` and `_curl_cffi_transport.py` real
        # coverage in nightly's coverage.json (no 0% blind spot). Installing
        # them in every compatibility cell also proves curl_cffi's native wheels
        # resolve across every supported Python version on Linux and on the
        # representative Python 3.12 macOS/Windows cells (nightly proves the
        # full 3-OS by 5-Python product).
        # `cookies` is now included since rookie-cookies supports all Python versions.
        #
        # Tradeoff: the deleted MCP/server jobs each enforced a scoped 90% floor.
        # mcp/server (and the curl_cffi adapter) are now covered only by nightly's
        # global aggregate gate — no per-subpackage floor backfills them, so a
        # subpackage could regress within the aggregate's headroom. Add entries to
        # `[tool.notebooklm.per_file_coverage_floors]` if that backstop is
        # wanted back.
        attempt=1; max=3
        until uv sync --frozen --extra browser --extra dev --extra markdown --extra mcp --extra server --extra impersonate --extra cookies; do
          if [ "$attempt" -ge "$max" ]; then
            echo "::error::uv sync failed after $max attempts" >&2
            exit 1
          fi
          echo "::warning::uv sync attempt $attempt failed; retrying in $((attempt * 15))s" >&2
          sleep $((attempt * 15))
          attempt=$((attempt + 1))
        done

    - name: Assert curl_cffi imports (native wheel; no silent skip)
      # The matrix installs --extra impersonate, so curl_cffi MUST import on every
      # OS/Python. It's a native wheel: if it installs but fails to import, the
      # importorskip'd curl_cffi suites would silently skip rather than fail.
      # This makes a broken native import a hard error in every compatibility cell.
      shell: bash
      run: uv run python -c "import curl_cffi"

    - name: Assert rookie-cookies imports (native wheel; no mock-only pass)
      # The cookie behavior tests replace this optional native module with
      # fakes. Import the installed wheel and pin the two entry points used by
      # production so a broken ABI wheel or incompatible package API fails on
      # every supported OS/Python pair.
      shell: bash
      run: >-
        uv run python -c "import rookie_cookies;
        assert callable(rookie_cookies.load);
        assert callable(rookie_cookies.any_browser)"

    - name: Get Playwright version
      if: matrix.canonical
      id: playwright-version
      shell: bash
      run: |
        echo "version=$(uv pip show playwright | grep '^Version:' | cut -d' ' -f2)" >> $GITHUB_OUTPUT

    - name: Cache Playwright browsers
      if: matrix.canonical
      uses: actions/cache@v6
      # Tolerate transient cache-backend failures: a miss already falls
      # through to the install step below, and a backend hiccup should be
      # treated the same. Without this, a 29s backend flake on a single
      # matrix entry hard-fails the job and skips the entire test run.
      continue-on-error: true
      with:
        path: ${{ github.workspace }}/.playwright-browsers
        # ``-ws`` suffix invalidates archives keyed to the prior dual-path
        # stanza so first restores after this change land on the new path.
        key: playwright-${{ matrix.os }}-${{ steps.playwright-version.outputs.version }}-ws

    - name: Install Playwright browsers
      if: matrix.canonical
      run: uv run playwright install chromium

    - name: Install Playwright system dependencies (Linux)
      if: matrix.canonical
      shell: bash
      run: |
        if ! timeout 180s uv run playwright install-deps chromium; then
          echo "::warning::Playwright system dependency installation timed out or failed."
          echo "::warning::Continuing so the non-browser test matrix can run."
        fi

    - name: Run required external-reality probes
      if: matrix.canonical
      run: >-
        uv run pytest tests/unit/cli/test_playwright_login_coverage.py
        -m reality --require-reality

    - name: Run Playwright-dependent unit tests serially
      if: matrix.canonical
      # These tests exercise real Playwright driver subprocesses. Keep them out
      # of xdist, but retain one complete PR lane instead of silently dropping
      # them from the reduced compatibility matrix.
      run: >-
        uv run pytest tests/unit
        -m "(requires_playwright or requires_chromium) and not reality"
        -n 0 --no-cov

    - name: Run critical contract guards
      if: matrix.canonical
      # Keep the positive baseline/public/security/CI contracts on every PR
      # while their expensive mutation variants live in the bounded manual
      # repo-lint lane.
      # This is one no-coverage lane, so it can use the runner's full worker set
      # without adding coverage collection to every compatibility cell.
      run: >-
        uv run pytest -n auto --dist worksteal --timeout=180 --no-cov
        tests/unit/test_ci_test_matrix.py
        tests/_guardrails/test_public_surface_manifest.py::test_baseline_registry_is_non_trivial
        tests/_guardrails/test_public_surface_manifest.py::test_baseline_matches_committed_file
        tests/_guardrails/test_no_flat_cookies_on_the_wire.py::test_no_flat_cookie_projection_reaches_an_http_request
        tests/_guardrails/test_master_token_minting_denylist.py::test_no_cli_module_imports_minting_primitives
        tests/_guardrails/test_master_token_path_single_site.py::test_no_bare_master_token_derivation_outside_paths_module
        tests/_guardrails/test_playwright_gateway.py::test_raw_sync_playwright_is_confined_to_policy_gateway
        tests/_guardrails/test_wire_contract.py::test_every_adapter_constant_is_declared
        tests/_guardrails/test_builtin_shadowed_annotations.py::test_class_body_annotations_do_not_name_a_shadowed_builtin

    - name: Run tests without coverage
      # Every required compatibility cell runs the ordinary suite exactly once.
      # Repository lint has a bounded manual lane, coverage and per-file floors
      # run nightly, and real Playwright subprocesses stay outside xdist.
      run: >-
        uv run pytest -n auto --dist loadgroup
        -m "not repo_lint and not requires_playwright and not requires_chromium"
        --no-cov

    - name: Run Windows Playwright compatibility smoke serially
      if: matrix.windows_playwright
      # The #89 regression only needs the real Playwright driver process; it
      # intentionally does not launch Chromium, so Windows needs no browser
      # download/cache. ``-n 0`` makes the process-policy smoke explicitly serial.
      run: >-
        uv run pytest
        tests/unit/test_windows_compatibility.py::TestPlaywrightSmokeTest::test_playwright_initializes_with_context_manager
        -m requires_playwright -n 0 --no-cov

  repo-lint:
    name: Repository Lint (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.custom_branch || github.ref }}
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: >-
        uv sync --frozen --extra browser --extra dev --extra markdown
        --extra mcp --extra server --extra impersonate --extra cookies

    - name: Run repository lint tests
      # Manual-only deep audits use the runner's available workers and a wider
      # per-test timeout, but never collect coverage or slow pull requests.
      run: >-
        uv run pytest -n auto --dist loadgroup -m repo_lint
        --timeout=180 --no-cov
