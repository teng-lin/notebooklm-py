  ObjectId objectId = 1;
  Range contentRange = 2;
}
message ObjectId {
  string id = 1;
}
message Citation {
  TailwindDocFragment fragment = 5;
  CitationSource sourceAttribution = 6;
  ObjectId objectId = 7;
}
message CitationSource {
  SourceRevision ingestedSource = 1;
}
message Range {
  int32 startIndex = 2;
  int32 endIndex = 3;
}
message TailwindDocFragment {
  repeated StructuralElement elements = 1;
}
message TextRun {
  string content = 1;
  TextStyle textStyle = 2;
}
message TableCell {
  int32 startIndex = 1;
  int32 endIndex = 2;
  repeated StructuralElement content = 3;
}
message TableRow {
  int32 startIndex = 1;
  int32 endIndex = 2;
  repeated TableCell tableCells = 3;
}
message Table {
  int32 rows = 1;
  int32 columns = 2;
  repeated TableRow tableRows = 3;
}
message ParagraphElement {
  int32 startIndex = 1;
  int32 endIndex = 2;
  TextRun textRun = 3;
  Image image = 4;
  Resource resource = 5;
}
message Paragraph {
  repeated ParagraphElement elements = 1;
  ParagraphStyle paragraphStyle = 2;
  BulletInfo bulletInfo = 4;
}
message Image {
  string url = 1;
  string sourceImageId = 3;
  ImageBlockReason blockReason = 4;
}
message A2uiBlock {
  string json = 1;
}
message CodeBlock {
  string content = 1;
  string languageHint = 2;
}
message Resource {
  string id = 1;
}
message Thought {
  repeated StructuralElement elements = 1;
}
message StructuralElement {
  int32 startIndex = 1;
  int32 endIndex = 2;
  Paragraph paragraph = 3;
  Table table = 5;
  Image image = 6;
  CodeBlock codeBlock = 7;
  A2uiBlock a2uiBlock = 8;
  Thought thought = 9;
  FunctionCall functionCall = 10;
  FunctionResponse functionResponse = 11;
  HorizontalRule horizontalRule = 12;
}
message Body {
  repeated StructuralElement content = 1;
  repeated AnnotationMapEntry inlineObjectLocations = 2;
}
message DocumentObject {
  ObjectId objectId = 1;
  Citation citation = 2;
}
message TailwindDoc {
  Body body = 1;
  repeated DocumentObject objects = 4;
  ResponseType type = 5;
}

