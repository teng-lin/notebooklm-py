// NotebookLM Android — recovered protobuf schema
//
// Source: reverse-engineered from the official Android app
//   (com.google.android.apps.labs.language.tailwind v1.46.7), Flutter AOT snapshot
//   libNotebookLM_prod_android_library_flutter_artifacts.so, Dart 3.13.0-256.0.dev.
// Method: blutter (ported to Dart 3.13) decompiled each GeneratedMessage's BuilderInfo._i();
//   field tag/name/type/cardinality parsed from the disassembled registrations
//   (aOS=string, aOM=message, aE=enum, aI=int, aOB=bool, aD=double, pPM=repeated message, ...).
//   See docs/mobile/capture.md and docs/mobile/endpoints.md.
//
// Ground truth: field NUMBERS, NAMES, and cardinality are from the binary (not inferred).
//   Scalar kinds from adders are exact; a few int widths (int32/int64) and enum vs message may
//   need confirmation. Wire-capture cross-check (docs/mobile/endpoints.md) agrees on every
//   RPC request/response message checked.
//
// 282 messages, 767 fields. Regenerate with scripts/parse_pbschema.py over a blutter dump.

