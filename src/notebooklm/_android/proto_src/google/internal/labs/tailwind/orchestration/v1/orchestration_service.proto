syntax = "proto3";

package google.internal.labs.tailwind.orchestration.v1;

import "google/internal/labs/tailwind/orchestration/v1/account.proto";
import "google/internal/labs/tailwind/orchestration/v1/artifacts.proto";
import "google/internal/labs/tailwind/orchestration/v1/chat.proto";
import "google/internal/labs/tailwind/orchestration/v1/notes.proto";
import "google/internal/labs/tailwind/orchestration/v1/notebooks.proto";
import "google/internal/labs/tailwind/orchestration/v1/organization.proto";
import "google/internal/labs/tailwind/orchestration/v1/read.proto";
import "google/internal/labs/tailwind/orchestration/v1/research.proto";
import "google/internal/labs/tailwind/orchestration/v1/sources.proto";

// Cumulative exact service closure for implemented Android calls whose request
// and response FQNs are independently evidenced. Implemented paths backed by
// repository-local wire-equivalent messages, or by a zero-byte response whose
// protobuf FQN is unproven, stay out of this descriptor and are exhaustively
// recorded in docs/android/grpc-service-signature-exceptions.json.
//
// GetArtifact, Research, GetLabels, and GetOrCreateAccount signatures below
// are exact and independently live-validated; their message overlays remain
// service-free. Zero-byte responses normalized by the external method manifest
// remain explicit signature exceptions because their remote response FQN is
// not proven.
service LabsTailwindOrchestrationService {
  rpc GetOrCreateAccount(GetOrCreateAccountRequest)
      returns (GetOrCreateAccountResponse);

  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListRecentlyViewedProjects(ListRecentlyViewedProjectsRequest)
      returns (ListRecentlyViewedProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc MutateProject(MutateProjectRequest) returns (Project);
  rpc GenerateNotebookGuide(GenerateNotebookGuideRequest)
      returns (GenerateNotebookGuideResponse);

  rpc AddTentativeSources(AddTentativeSourcesRequest)
      returns (AddTentativeSourcesResponse);
  rpc AddSources(AddSourcesRequest) returns (AddSourcesResponse);
  rpc GenerateDocumentGuides(GenerateDocumentGuidesRequest)
      returns (GenerateDocumentGuidesResponse);
  rpc LoadSource(LoadSourceRequest) returns (LoadSourceResponse);

  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  rpc CreateArtifact(CreateArtifactRequest) returns (CreateArtifactResponse);
  rpc UpdateArtifact(UpdateArtifactRequest) returns (Artifact);

  rpc ListChatSessions(ListChatSessionsRequest) returns (ListChatSessionsResponse);
  rpc ListChatTurns(ListChatTurnsRequest) returns (ListChatTurnsResponse);
  rpc GenerateFreeFormStreamed(GenerateFreeFormStreamedRequest)
      returns (stream GenerateFreeFormStreamedResponse);

  rpc GetNotes(GetNotesRequest) returns (GetNotesResponse);
  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);
  rpc MutateNote(MutateNoteRequest) returns (MutateNoteResponse);

  rpc DiscoverSources(DiscoverSourcesRequest) returns (DiscoverSourcesResponse);
  rpc DiscoverSourcesManifold(DiscoverSourcesManifoldRequest)
      returns (DiscoverSourcesManifoldResponse);
  rpc DiscoverSourcesAsync(DiscoverSourcesAsyncRequest)
      returns (DiscoverSourcesAsyncResponse);
  rpc ListDiscoverSourcesJob(ListDiscoverSourcesJobRequest)
      returns (ListDiscoverSourcesJobResponse);
  rpc FinishDiscoverSourcesRun(FinishDiscoverSourcesRunRequest)
      returns (FinishDiscoverSourcesRunResponse);

  rpc GetLabels(GetLabelsRequest) returns (GetLabelsResponse);
}
