syntax = "proto3";

package google.internal.labs.tailwind.orchestration.v1;

import "google/internal/labs/tailwind/orchestration/v1/read.proto";
import "labs/language/tailwind/common/protos/metadata.proto";
import "labs/language/tailwind/common/protos/provenance.proto";

// Exact-package source-operation closure admitted by source, plus the explicitly
// web-derived MutateSource signature. Its method/type names follow the current
// bundle registration; the populated field tags are pinned by successful
// Android-bearer replay.

message InputSource {
  SourceId source_id = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message Snippet {
  string text_snippet = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message MainIdeas {
  repeated string text_ideas = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message DocumentGuide {
  // Optional on the wire: populated for text sources, omitted for URL sources.
  InputSource source = 1; // evidence: docs/android/proto-evidence-ledger.md#document-guide-source-echo
  Snippet snippet = 2; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
  MainIdeas main_ideas = 3; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message GenerateDocumentGuidesRequest {
  repeated InputSource sources = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message GenerateDocumentGuidesResponse {
  repeated DocumentGuide guides = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message TentativeSourceMetadata {
  string name = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message AddTentativeSourcesRequest {
  repeated TentativeSourceMetadata tentative_sources_metadata = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
  string project_id = 2; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
  .labs.language.tailwind.common.protos.RequestContext request_context = 3; // evidence: docs/android/file-transfer-evidence.md
  .labs.language.tailwind.common.protos.Provenance provenance = 4; // evidence: docs/android/file-transfer-evidence.md
}

message AddTentativeSourcesResponse {
  repeated Source tentative_sources = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message WebContent {
  string url = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
  string source_name = 2; // evidence: docs/android/deep-research-evidence.md
}

message TextContent {
  string source_name = 1; // evidence: docs/android/deep-research-evidence.md
  string content = 2; // evidence: docs/android/deep-research-evidence.md
}

message GoogleDriveContent {
  string document_id = 1;
  string mime_type = 2;
  bool can_download = 3;
  string source_name = 4;
}

message VideoContent {
  string youtube_url = 1;
}

message UserContent {
  enum TextContentType {
    CONTENT_TYPE_UNKNOWN = 0;
    CONTENT_TYPE_PDF = 1;
    CONTENT_TYPE_TEXT = 2;
    CONTENT_TYPE_MARKDOWN = 3;
    CONTENT_TYPE_AUDIO_TRANSCRIPT = 4;
    CONTENT_TYPE_EPUB = 5;
    CONTENT_TYPE_GEMINI_CHAT = 6;
    CONTENT_TYPE_CSV = 7;
  }

  GoogleDriveContent google_drive_content = 1;
  TextContent text_content = 2; // evidence: docs/android/deep-research-evidence.md
  WebContent web_content = 3; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
  TextContentType text_content_type = 4; // evidence: docs/android/deep-research-evidence.md
  VideoContent video_content = 8;
  SourceId tentative_source_id = 9; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message AddSourcesRequest {
  repeated UserContent user_content = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
  string project_id = 2; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
  .labs.language.tailwind.common.protos.RequestContext request_context = 3;
}

message AddSourcesResponse {
  repeated Source sources = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message DeleteSourcesRequest {
  repeated SourceId source_ids = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message ChangeTitle {
  string title = 1;
}

message SourceMutation {
  oneof mutation {
    ChangeTitle change_title = 1;
  }
  // Live oneof branches #2/#3 remain unrecovered and therefore undeclared.
}

message MutateSourceRequest {
  SourceId source_id = 2;
  repeated SourceMutation mutations = 3;
  .labs.language.tailwind.common.protos.RequestContext request_context = 4;
}

// The web response constructor is a dedicated wrapper around Source at #1.
message MutateSourceResponse {
  Source source = 1;
}

// Web-derived request/response closure for yR9Yof. The route is absent from
// the APK method table, while the populated tags and empty-success response
// were pinned by successful Android-bearer replay.
message CheckSourceFreshnessRequest {
  SourceId source_id = 2;
  .labs.language.tailwind.common.protos.RequestContext request_context = 3;
}

message SourceFreshness {
  optional bool is_fresh = 2;
  SourceId source_id = 3;
}

message CheckSourceFreshnessResponse {
  SourceFreshness source_freshness = 1;
}

message RefreshSourceRequest {
  SourceId source_id = 2; // exact current Web constructor bLb field #2
  .labs.language.tailwind.common.protos.RequestContext request_context = 3; // exact current Web constructor bLb field #3
}

message RefreshSourceResponse {
  Source source = 1; // exact current Web response wrapper field #1
}

message PlainTextSourceContent {
  string header = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
  string body = 2; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message LoadSourceRequest {
  SourceId source_id = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
}

message LoadSourceResponse {
  Source source = 1; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
  PlainTextSourceContent plain_text = 2; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
  string markdown_string = 3; // evidence: docs/android/proto-evidence-ledger.md#source-field-ledger
  // Exact TailwindDoc #4 is decoded through the repository-local
  // WireLoadSourceResponse overlay to avoid the sources.proto <-> chat.proto
  // import cycle created by chat's InputSource dependency.
}

message UploadFileRequest {
  string project_id = 3; // evidence: docs/android/file-transfer-evidence.md
  .labs.language.tailwind.common.protos.RequestContext request_context = 4; // evidence: docs/android/file-transfer-evidence.md
  string source_id = 5; // evidence: docs/android/file-transfer-evidence.md
  .labs.language.tailwind.common.protos.Provenance provenance = 6; // evidence: docs/android/file-transfer-evidence.md
}
