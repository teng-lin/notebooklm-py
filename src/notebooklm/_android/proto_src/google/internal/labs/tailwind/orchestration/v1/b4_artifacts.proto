  ARTIFACT_STATUS_UNKNOWN = 0;
  ARTIFACT_STATUS_INITIALIZED = 1;
  ARTIFACT_STATUS_PROCESSING = 2;
  ARTIFACT_STATUS_READY = 3;
  ARTIFACT_STATUS_FAILED = 4;
  ARTIFACT_STATUS_SUGGESTED = 5;
  ARTIFACT_PENDING_REVIEW = 6;
}

