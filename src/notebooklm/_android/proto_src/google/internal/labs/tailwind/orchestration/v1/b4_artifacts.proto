  ARTIFACT_TYPE_INFOGRAPHIC = 7;
  ARTIFACT_TYPE_SLIDES = 8;
  ARTIFACT_TYPE_TABLE = 9;
  ARTIFACT_TYPE_FILE = 10;
}

