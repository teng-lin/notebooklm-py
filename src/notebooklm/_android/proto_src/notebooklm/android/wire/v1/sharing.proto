syntax = "proto3";

package notebooklm.android.wire.v1;

import "labs/language/tailwind/common/protos/common.proto";
import "labs/language/tailwind/sharing/sharing.proto";

// Repository-local sharing response parser. The exact service path, message names,
// imported public-settings FQN, and field tags are evidenced. This local
// wrapper exists only so proto3 optional preserves scalar presence on fields
// #3/#4; the exact-package response descriptor remains the remote type.

message GetProjectDetailsResponse {
  repeated .labs.language.tailwind.sharing.SharedUser shared_users = 1;
  .labs.language.tailwind.common.protos.ProjectPublicSettings public_settings = 2;
  optional int32 max_individuals_share_limit = 3;
  optional bool is_public_sharing_allowed = 4;
}
