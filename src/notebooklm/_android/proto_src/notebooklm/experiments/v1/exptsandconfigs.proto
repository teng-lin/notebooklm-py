syntax = "proto3";

package notebooklm.experiments.v1;

// Minimal, hand-narrowed closure of Google's private Phenotype/Heterodyne
// `getExperimentsAndConfigs` endpoint
// (https://www.googleapis.com/experimentsandconfigs/v1/getExperimentsAndConfigs).
//
// This is NOT a NotebookLM (notebooklm-pa) RPC. It is the GMS experiment
// registration that mints the per-account `serverToken` the app forwards to
// notebooklm-pa in the `x-goog-ext-202964622-bin` metadata to unlock the
// Expert-Intelligence (Google Play Books) add path (#2302, follow-up to #2292).
//
// Only the fields the client sends or reads are declared; every other field in
// the real messages is intentionally omitted (proto3 skips unknown fields on
// decode). Field NUMBERS are load-bearing and match the wire format reverse
// engineered by doug-leith/android-protobuf-decoding; field names are our own.

message HeterodyneRequest {
  HeterodyneRequestHeader header = 1;

  message AuthTokenIndex {
    // `optional` gives proto3 field presence so `index = 0` (the common case —
    // one auth token in the Authorization header) is serialized rather than
    // omitted as the default. The server requires it to bind the token; without
    // it the minted serverToken omits the account's experiments (#2302).
    optional int32 index = 1;
  }

  message PackageDetails {
    string package_name = 1;
    int32 version = 2;
    AuthTokenIndex auth_token_index = 3;
    int64 baseline_cl = 4;
  }

  message RequestData {
    PackageDetails package_details = 1;
    // Current committed serverToken as a delta baseline; empty = full fetch.
    bytes experiment_tokens = 4;
    bytes heterodyne_info = 6;
  }

  repeated RequestData data = 2;
  int32 fetch_reason = 4;    // mirrors the ?r= query parameter
  int32 config_class = 5;    // mirrors the ?c= query parameter
  string package_name = 7;   // host Android package
}

message HeterodyneRequestHeader {
  message DeviceInfo {
    int64 android_id = 1;
    string logging_id = 2;
    int32 sdk_version = 3;
    string model = 4;
    string product = 5;
    string build_id = 6;
    string gms_version_string = 7;
    string hardware = 8;
    string device = 9;
    string sim_operator = 10;
    string language = 11;
    string country = 12;
    string manufacturer = 13;
    string brand = 14;
    string board = 15;
    string radio_version = 16;
    string build_fingerprint = 17;
    int32 gms_version_code = 19;
    string build_type = 26;
  }

  message ClearcutLoggerHeader {
    int32 log_source = 1;  // fixed value 4 in captures
    DeviceInfo device_info = 2;
    int64 timestamp_millis = 12;
  }

  ClearcutLoggerHeader clearcut_logger_header = 4;
  string pseudonymous_id_token = 5;
}

message HeterodyneResponse {
  message Config {
    message PackageDetails {
      string package_name = 1;
      int32 version = 2;
    }
    PackageDetails package_details = 1;
    // base64url-encoded ServerToken message: {1: client_type, 2: token blob}.
    string server_token = 4;
  }

  repeated Config heterodyne_config = 1;
  int64 server_timestamp = 4;
}
